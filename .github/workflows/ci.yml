name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Scan for secrets
        uses: willibrandon/picket@v0.1.10
        with:
          cache-mode: secret-hash-only
          fail-on: findings
          redact: 100
          timeout: 300

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Build benchmarks
        run: dotnet build benchmarks/Dotsider.Benchmarks/Dotsider.Benchmarks.csproj --configuration Release --no-restore

      - name: Test
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail

          for project in \
            tests/Dotsider.Tests/Dotsider.Tests.csproj \
            tests/Dotsider.Mcp.Tests/Dotsider.Mcp.Tests.csproj \
            tests/Dotsider.Website.Tests/Dotsider.Website.Tests.csproj
          do
            project_name="$(basename "$(dirname "$project")")"
            result_dir="TestResults/${{ matrix.os }}/${project_name}"
            mkdir -p "$result_dir"
            export DOTSIDER_R2R_DIAGNOSTICS=1
            export DOTSIDER_R2R_DIAGNOSTICS_PATH="$result_dir/r2r-diagnostics.log"
            : > "$DOTSIDER_R2R_DIAGNOSTICS_PATH"
            set +e
            dotnet test "$project" \
              --no-build \
              --report-trx \
              --results-directory "$result_dir" \
              --coverage \
              --coverage-output-format cobertura \
              --diagnostic \
              --diagnostic-verbosity Trace \
              --diagnostic-output-directory "$result_dir" \
              --diagnostic-file-prefix "$project_name" \
              2>&1 | tee "$result_dir/dotnet-test.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          done

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/*.cobertura.xml
            TestResults/**/*.diag
            TestResults/**/*.log

  native-aot:
    name: Native AOT (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: linux-musl-x64
            os: ubuntu-latest
          - rid: linux-musl-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-26-intel
          - rid: osx-arm64
            os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Install Linux Native AOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y clang zlib1g-dev

      - name: Install musl toolchain
        if: startsWith(matrix.rid, 'linux-musl-')
        shell: bash
        run: sudo apt-get -o Acquire::Retries=5 install -y musl-tools

      - name: Publish and verify Native AOT applications
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $version = '0.0.0-ci'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $nativeRoot = Join-Path $PWD "artifacts/native-aot/$rid"
          $packageRoot = Join-Path $nativeRoot 'packages'
          $workspace = (Get-Location).Path
          $isMusl = $rid.StartsWith('linux-musl-', [StringComparison]::Ordinal)
          New-Item -ItemType Directory -Force -Path $nativeRoot, $packageRoot | Out-Null

          function Invoke-NativeApplication {
            param(
              [Parameter(Mandatory=$true)][string]$Executable,
              [string[]]$ArgumentList = @()
            )

            if ($isMusl) {
              $relativeExecutable = [IO.Path]::GetRelativePath($workspace, $Executable).Replace('\', '/')
              docker run --rm --volume "${workspace}:/work" --workdir /work `
                mcr.microsoft.com/dotnet/runtime:10.0-alpine "/work/$relativeExecutable" @ArgumentList
            } else {
              & $Executable @ArgumentList
            }
          }

          function Get-NativeArgumentPath {
            param([Parameter(Mandatory=$true)][string]$Path)

            if ($isMusl) {
              $relativePath = [IO.Path]::GetRelativePath($workspace, $Path).Replace('\', '/')
              return "/work/$relativePath"
            }

            return $Path
          }

          dotnet build samples/HelloWorld/HelloWorld.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Failed to build the runtime tracing fixture.' }

          $products = @(
            @{ Name = 'dotsider'; Project = 'src/Dotsider/Dotsider.csproj'; Package = 'Dotsider' },
            @{ Name = 'dotsider-mcp'; Project = 'src/Dotsider.Mcp/Dotsider.Mcp.csproj'; Package = 'Dotsider.Mcp' }
          )

          foreach ($product in $products) {
            $output = Join-Path $nativeRoot $product.Name
            dotnet publish $product.Project --configuration Release --runtime $rid --output $output
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish $($product.Name) for $rid." }

            $executable = Join-Path $output "$($product.Name)$extension"
            if (!(Test-Path -LiteralPath $executable -PathType Leaf)) { throw "Missing executable $executable" }
            $traceHost = Join-Path $output 'tracehost/dotsider-tracehost.dll'
            if ($product.Name -eq 'dotsider' -and !(Test-Path -LiteralPath $traceHost -PathType Leaf)) {
              throw 'The dotsider Native AOT payload does not contain its runtime trace host.'
            }
            if ($product.Name -eq 'dotsider-mcp' -and (Test-Path -LiteralPath $traceHost)) {
              throw 'The dotsider-mcp Native AOT payload contains an unused runtime trace host.'
            }
            Invoke-NativeApplication -Executable $executable -ArgumentList @('--version')
            if ($LASTEXITCODE -ne 0) { throw "$($product.Name) --version failed for $rid." }

            dotnet pack $product.Project --configuration Release --runtime $rid `
              -p:Version=$version -p:PackageVersion=$version --output $packageRoot
            if ($LASTEXITCODE -ne 0) { throw "Failed to pack $($product.Name) for $rid." }

            $package = Join-Path $packageRoot "$($product.Package).$rid.$version.nupkg"
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archive = [IO.Compression.ZipFile]::OpenRead($package)
            try {
              $containsTraceHost = @($archive.Entries.FullName | Where-Object {
                $_ -match '(?i)/tracehost/dotsider-tracehost\.dll$'
              }).Count -ne 0
              if ($product.Name -eq 'dotsider' -and !$containsTraceHost) {
                throw "Tool package $package does not contain the runtime trace host."
              }
              if ($product.Name -eq 'dotsider-mcp' -and $containsTraceHost) {
                throw "Tool package $package contains an unused runtime trace host."
              }
            }
            finally {
              $archive.Dispose()
            }

            $implementationId = "$($product.Package).$rid"
            $toolPath = Join-Path $nativeRoot "$($product.Name)-tool"
            dotnet tool install $implementationId --tool-path $toolPath --version $version `
              --add-source $packageRoot --no-cache --ignore-failed-sources
            if ($LASTEXITCODE -ne 0) { throw "Failed to install $implementationId." }
            & (Join-Path $toolPath "$($product.Name)$extension") --version
            if ($LASTEXITCODE -ne 0) { throw "The installed $implementationId tool did not run." }
          }

          $smokeOutput = Join-Path $nativeRoot 'runtime-tracing'
          dotnet publish tests/Dotsider.NativeAotSmoke/Dotsider.NativeAotSmoke.csproj --configuration Release --runtime $rid --output $smokeOutput
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish the runtime tracing smoke test for $rid." }
          $traceTarget = Join-Path $PWD 'samples/HelloWorld/bin/Release/net10.0/HelloWorld.dll'
          $traceTargetArgument = Get-NativeArgumentPath -Path $traceTarget
          Invoke-NativeApplication -Executable (Join-Path $smokeOutput "Dotsider.NativeAotSmoke$extension") `
            -ArgumentList @($traceTargetArgument)
          if ($LASTEXITCODE -ne 0) { throw "Native AOT runtime tracing failed for $rid." }

          $dotsider = Join-Path $nativeRoot "dotsider/dotsider$extension"
          $analysisTarget = Get-NativeArgumentPath -Path $dotsider
          $analysis = Invoke-NativeApplication -Executable $dotsider `
            -ArgumentList @('analyze', $analysisTarget, '--json')
          if ($LASTEXITCODE -ne 0) { throw "Native AOT JSON analysis failed for $rid." }
          $analysis | ConvertFrom-Json | Out-Null

  deploy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run deploy tests
        run: bash tests/deploy/run.sh
