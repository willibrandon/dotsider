name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: |
          dotnet pack src/Dotsider/Dotsider.csproj -c Release -o ./nupkg
          dotnet pack src/Dotsider.Mcp/Dotsider.Mcp.csproj -c Release -o ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  build-binaries:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            artifact: dotsider-win-x64
            arch: x64
          - rid: win-arm64
            os: windows-latest
            artifact: dotsider-win-arm64
            arch: arm64
          - rid: linux-x64
            os: ubuntu-latest
            artifact: dotsider-linux-x64
          - rid: linux-arm64
            os: ubuntu-latest
            artifact: dotsider-linux-arm64
          - rid: osx-arm64
            os: macos-26
            artifact: dotsider-osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish dotsider
        run: dotnet publish src/Dotsider/Dotsider.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o ./publish/dotsider

      - name: Publish dotsider-mcp
        run: dotnet publish src/Dotsider.Mcp/Dotsider.Mcp.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o ./publish/dotsider-mcp

      - name: Upload dotsider artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ./publish/dotsider/dotsider*

      - name: Upload dotsider-mcp artifact
        uses: actions/upload-artifact@v7
        with:
          name: dotsider-mcp-${{ matrix.rid }}
          path: ./publish/dotsider-mcp/dotsider-mcp*

      - name: Extract version from tag
        if: startsWith(matrix.rid, 'win-')
        id: version
        shell: pwsh
        run: |
          $fullVersion = "${{ github.ref_name }}" -replace '^v', ''
          echo "full_version=$fullVersion" >> $env:GITHUB_OUTPUT
          $msiVersion = $fullVersion -replace '-.*$', ''
          echo "msi_version=$msiVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Full version: $fullVersion, MSI version: $msiVersion"

      - name: Install WiX Toolset
        if: startsWith(matrix.rid, 'win-')
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build dotsider MSI
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          wix build wix\dotsider.wxs `
            -d SourceDir=..\publish\dotsider `
            -d Version=${{ steps.version.outputs.msi_version }} `
            -arch ${{ matrix.arch }} `
            -out publish\${{ matrix.artifact }}.msi

      - name: Build dotsider-mcp MSI
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          wix build wix\dotsider-mcp.wxs `
            -d SourceDir=..\publish\dotsider-mcp `
            -d Version=${{ steps.version.outputs.msi_version }} `
            -arch ${{ matrix.arch }} `
            -out publish\dotsider-mcp-${{ matrix.rid }}.msi

      - name: Verify dotsider MSI installs correctly
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $logFile = "publish\msi-install.log"
          $proc = Start-Process msiexec.exe -ArgumentList "/i", "publish\${{ matrix.artifact }}.msi", "/qn", "/l*v", $logFile -Wait -NoNewWindow -PassThru

          if ($proc.ExitCode -ne 0) {
            Write-Error "MSI installation failed with exit code: $($proc.ExitCode)"
            if (Test-Path $logFile) {
              Get-Content $logFile | Select-Object -Last 50
            }
            exit 1
          }

          $exePath = "${env:ProgramFiles}\dotsider\dotsider.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "dotsider.exe not found at $exePath"
            exit 1
          }

          & $exePath --version
          Write-Host "dotsider MSI verification passed"

          Start-Process msiexec.exe -ArgumentList "/x", "publish\${{ matrix.artifact }}.msi", "/qn" -Wait -NoNewWindow

      - name: Verify dotsider-mcp MSI installs correctly
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $logFile = "publish\mcp-msi-install.log"
          $proc = Start-Process msiexec.exe -ArgumentList "/i", "publish\dotsider-mcp-win-x64.msi", "/qn", "/l*v", $logFile -Wait -NoNewWindow -PassThru

          if ($proc.ExitCode -ne 0) {
            Write-Error "dotsider-mcp MSI installation failed with exit code: $($proc.ExitCode)"
            if (Test-Path $logFile) {
              Get-Content $logFile | Select-Object -Last 50
            }
            exit 1
          }

          $exePath = "${env:ProgramFiles}\dotsider-mcp\dotsider-mcp.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "dotsider-mcp.exe not found at $exePath"
            exit 1
          }

          & $exePath --version
          Write-Host "dotsider-mcp MSI verification passed"

          Start-Process msiexec.exe -ArgumentList "/x", "publish\dotsider-mcp-win-x64.msi", "/qn" -Wait -NoNewWindow

      - name: Upload dotsider MSI artifact
        if: startsWith(matrix.rid, 'win-')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-msi
          path: ./publish/${{ matrix.artifact }}.msi

      - name: Upload dotsider-mcp MSI artifact
        if: startsWith(matrix.rid, 'win-')
        uses: actions/upload-artifact@v7
        with:
          name: dotsider-mcp-${{ matrix.rid }}-msi
          path: ./publish/dotsider-mcp-${{ matrix.rid }}.msi

  create-release:
    needs: [pack-and-publish, build-binaries]
    runs-on: ubuntu-latest
    outputs:
      sha256_linux_x64: ${{ steps.checksums.outputs.sha256_linux_x64 }}
      sha256_linux_arm64: ${{ steps.checksums.outputs.sha256_linux_arm64 }}
      sha256_osx_arm64: ${{ steps.checksums.outputs.sha256_osx_arm64 }}
      sha256_win_x64: ${{ steps.checksums.outputs.sha256_win_x64 }}
      sha256_win_arm64: ${{ steps.checksums.outputs.sha256_win_arm64 }}
      sha256_win_msi: ${{ steps.checksums.outputs.sha256_win_msi }}
      sha256_win_arm64_msi: ${{ steps.checksums.outputs.sha256_win_arm64_msi }}
      sha256_mcp_linux_x64: ${{ steps.checksums.outputs.sha256_mcp_linux_x64 }}
      sha256_mcp_linux_arm64: ${{ steps.checksums.outputs.sha256_mcp_linux_arm64 }}
      sha256_mcp_osx_arm64: ${{ steps.checksums.outputs.sha256_mcp_osx_arm64 }}
      sha256_mcp_win_x64: ${{ steps.checksums.outputs.sha256_mcp_win_x64 }}
      sha256_mcp_win_arm64: ${{ steps.checksums.outputs.sha256_mcp_win_arm64 }}
      sha256_mcp_win_msi: ${{ steps.checksums.outputs.sha256_mcp_win_msi }}
      sha256_mcp_win_arm64_msi: ${{ steps.checksums.outputs.sha256_mcp_win_arm64_msi }}
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Package binaries
        run: |
          cd artifacts

          # dotsider
          chmod +x dotsider-linux-x64/dotsider
          chmod +x dotsider-linux-arm64/dotsider
          chmod +x dotsider-osx-arm64/dotsider
          tar -czf dotsider-linux-x64.tar.gz -C dotsider-linux-x64 .
          tar -czf dotsider-linux-arm64.tar.gz -C dotsider-linux-arm64 .
          tar -czf dotsider-osx-arm64.tar.gz -C dotsider-osx-arm64 .
          cd dotsider-win-x64 && zip -r ../dotsider-win-x64.zip . && cd ..
          cd dotsider-win-arm64 && zip -r ../dotsider-win-arm64.zip . && cd ..
          cp dotsider-win-x64-msi/dotsider-win-x64.msi .
          cp dotsider-win-arm64-msi/dotsider-win-arm64.msi .

          # dotsider-mcp
          chmod +x dotsider-mcp-linux-x64/dotsider-mcp
          chmod +x dotsider-mcp-linux-arm64/dotsider-mcp
          chmod +x dotsider-mcp-osx-arm64/dotsider-mcp
          tar -czf dotsider-mcp-linux-x64.tar.gz -C dotsider-mcp-linux-x64 .
          tar -czf dotsider-mcp-linux-arm64.tar.gz -C dotsider-mcp-linux-arm64 .
          tar -czf dotsider-mcp-osx-arm64.tar.gz -C dotsider-mcp-osx-arm64 .
          cd dotsider-mcp-win-x64 && zip -r ../dotsider-mcp-win-x64.zip . && cd ..
          cd dotsider-mcp-win-arm64 && zip -r ../dotsider-mcp-win-arm64.zip . && cd ..
          cp dotsider-mcp-win-x64-msi/dotsider-mcp-win-x64.msi .
          cp dotsider-mcp-win-arm64-msi/dotsider-mcp-win-arm64.msi .

      - name: Calculate SHA256 checksums
        id: checksums
        run: |
          cd artifacts

          # dotsider checksums
          sha256sum dotsider-linux-x64.tar.gz > dotsider-linux-x64.tar.gz.sha256
          sha256sum dotsider-linux-arm64.tar.gz > dotsider-linux-arm64.tar.gz.sha256
          sha256sum dotsider-osx-arm64.tar.gz > dotsider-osx-arm64.tar.gz.sha256
          sha256sum dotsider-win-x64.zip > dotsider-win-x64.zip.sha256
          sha256sum dotsider-win-x64.msi > dotsider-win-x64.msi.sha256
          sha256sum dotsider-win-arm64.zip > dotsider-win-arm64.zip.sha256
          sha256sum dotsider-win-arm64.msi > dotsider-win-arm64.msi.sha256

          echo "sha256_linux_x64=$(cut -d' ' -f1 dotsider-linux-x64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_linux_arm64=$(cut -d' ' -f1 dotsider-linux-arm64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_osx_arm64=$(cut -d' ' -f1 dotsider-osx-arm64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_win_x64=$(cut -d' ' -f1 dotsider-win-x64.zip.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_win_arm64=$(cut -d' ' -f1 dotsider-win-arm64.zip.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_win_msi=$(cut -d' ' -f1 dotsider-win-x64.msi.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_win_arm64_msi=$(cut -d' ' -f1 dotsider-win-arm64.msi.sha256)" >> $GITHUB_OUTPUT

          # dotsider-mcp checksums
          sha256sum dotsider-mcp-linux-x64.tar.gz > dotsider-mcp-linux-x64.tar.gz.sha256
          sha256sum dotsider-mcp-linux-arm64.tar.gz > dotsider-mcp-linux-arm64.tar.gz.sha256
          sha256sum dotsider-mcp-osx-arm64.tar.gz > dotsider-mcp-osx-arm64.tar.gz.sha256
          sha256sum dotsider-mcp-win-x64.zip > dotsider-mcp-win-x64.zip.sha256
          sha256sum dotsider-mcp-win-x64.msi > dotsider-mcp-win-x64.msi.sha256
          sha256sum dotsider-mcp-win-arm64.zip > dotsider-mcp-win-arm64.zip.sha256
          sha256sum dotsider-mcp-win-arm64.msi > dotsider-mcp-win-arm64.msi.sha256

          echo "sha256_mcp_linux_x64=$(cut -d' ' -f1 dotsider-mcp-linux-x64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_mcp_linux_arm64=$(cut -d' ' -f1 dotsider-mcp-linux-arm64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_mcp_osx_arm64=$(cut -d' ' -f1 dotsider-mcp-osx-arm64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_mcp_win_x64=$(cut -d' ' -f1 dotsider-mcp-win-x64.zip.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_mcp_win_arm64=$(cut -d' ' -f1 dotsider-mcp-win-arm64.zip.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_mcp_win_msi=$(cut -d' ' -f1 dotsider-mcp-win-x64.msi.sha256)" >> $GITHUB_OUTPUT
          echo "sha256_mcp_win_arm64_msi=$(cut -d' ' -f1 dotsider-mcp-win-arm64.msi.sha256)" >> $GITHUB_OUTPUT

          echo "SHA256 Checksums:"
          cat *.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          RELEASE_FLAGS=""
          if [[ "$TAG" == *-* ]]; then
            RELEASE_FLAGS="--prerelease"
            PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          else
            RELEASE_FLAGS="--latest"
            PREV_TAG=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          fi
          NOTES_FLAG="--generate-notes"
          if [ -n "$PREV_TAG" ]; then
            NOTES_FLAG="--generate-notes --notes-start-tag $PREV_TAG"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            $NOTES_FLAG \
            $RELEASE_FLAGS \
            artifacts/dotsider-win-x64.zip \
            artifacts/dotsider-win-x64.zip.sha256 \
            artifacts/dotsider-win-x64.msi \
            artifacts/dotsider-win-x64.msi.sha256 \
            artifacts/dotsider-win-arm64.zip \
            artifacts/dotsider-win-arm64.zip.sha256 \
            artifacts/dotsider-win-arm64.msi \
            artifacts/dotsider-win-arm64.msi.sha256 \
            artifacts/dotsider-linux-x64.tar.gz \
            artifacts/dotsider-linux-x64.tar.gz.sha256 \
            artifacts/dotsider-linux-arm64.tar.gz \
            artifacts/dotsider-linux-arm64.tar.gz.sha256 \
            artifacts/dotsider-osx-arm64.tar.gz \
            artifacts/dotsider-osx-arm64.tar.gz.sha256 \
            artifacts/dotsider-mcp-win-x64.zip \
            artifacts/dotsider-mcp-win-x64.zip.sha256 \
            artifacts/dotsider-mcp-win-x64.msi \
            artifacts/dotsider-mcp-win-x64.msi.sha256 \
            artifacts/dotsider-mcp-win-arm64.zip \
            artifacts/dotsider-mcp-win-arm64.zip.sha256 \
            artifacts/dotsider-mcp-win-arm64.msi \
            artifacts/dotsider-mcp-win-arm64.msi.sha256 \
            artifacts/dotsider-mcp-linux-x64.tar.gz \
            artifacts/dotsider-mcp-linux-x64.tar.gz.sha256 \
            artifacts/dotsider-mcp-linux-arm64.tar.gz \
            artifacts/dotsider-mcp-linux-arm64.tar.gz.sha256 \
            artifacts/dotsider-mcp-osx-arm64.tar.gz \
            artifacts/dotsider-mcp-osx-arm64.tar.gz.sha256

  update-homebrew:
    needs: create-release
    if: "!contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Clone homebrew-tap repository
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/willibrandon/homebrew-tap.git
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update formulas with new version and checksums
        run: |
          cd homebrew-tap
          VERSION="${{ steps.version.outputs.version }}"

          # Update dotsider formula
          sed -i "s/version \".*\"/version \"$VERSION\"/" Formula/dotsider.rb

          python3 << 'EOF'
          import re

          # Update dotsider checksums
          with open('Formula/dotsider.rb', 'r') as f:
              content = f.read()

          shas = {
              'osx-arm64': '${{ needs.create-release.outputs.sha256_osx_arm64 }}',
              'linux-arm64': '${{ needs.create-release.outputs.sha256_linux_arm64 }}',
              'linux-x64': '${{ needs.create-release.outputs.sha256_linux_x64 }}',
          }

          for platform, sha in shas.items():
              pattern = rf'(url "https://github\.com/willibrandon/dotsider/releases/download/v#\{{version\}}/dotsider-{platform}\.tar\.gz"\s+sha256 ")[^"]*(")'
              content = re.sub(pattern, rf'\g<1>{sha}\2', content)

          with open('Formula/dotsider.rb', 'w') as f:
              f.write(content)

          # Update dotsider-mcp checksums
          with open('Formula/dotsider-mcp.rb', 'r') as f:
              content = f.read()

          shas_mcp = {
              'osx-arm64': '${{ needs.create-release.outputs.sha256_mcp_osx_arm64 }}',
              'linux-arm64': '${{ needs.create-release.outputs.sha256_mcp_linux_arm64 }}',
              'linux-x64': '${{ needs.create-release.outputs.sha256_mcp_linux_x64 }}',
          }

          for platform, sha in shas_mcp.items():
              pattern = rf'(url "https://github\.com/willibrandon/dotsider/releases/download/v#\{{version\}}/dotsider-mcp-{platform}\.tar\.gz"\s+sha256 ")[^"]*(")'
              content = re.sub(pattern, rf'\g<1>{sha}\2', content)

          with open('Formula/dotsider-mcp.rb', 'w') as f:
              f.write(content)
          EOF

          # Update dotsider-mcp formula version
          sed -i "s/version \".*\"/version \"$VERSION\"/" Formula/dotsider-mcp.rb

          echo "Updated Formula/dotsider.rb:"
          cat Formula/dotsider.rb
          echo ""
          echo "Updated Formula/dotsider-mcp.rb:"
          cat Formula/dotsider-mcp.rb

      - name: Commit and push changes
        run: |
          cd homebrew-tap
          VERSION="${{ steps.version.outputs.version }}"

          git add Formula/dotsider.rb Formula/dotsider-mcp.rb
          git diff --staged --quiet || git commit -m "Update dotsider and dotsider-mcp to $VERSION"
          git push origin main

  update-scoop:
    needs: create-release
    if: "!contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Clone scoop-bucket repository
        run: |
          git clone https://x-access-token:${{ secrets.SCOOP_BUCKET_TOKEN }}@github.com/willibrandon/scoop-bucket.git
          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update manifests with new version and checksums
        run: |
          cd scoop-bucket
          VERSION="${{ steps.version.outputs.version }}"

          python3 << 'EOF'
          import json

          version = "${{ steps.version.outputs.version }}"

          # Update dotsider manifest
          sha_win_x64 = "${{ needs.create-release.outputs.sha256_win_x64 }}"
          sha_win_arm64 = "${{ needs.create-release.outputs.sha256_win_arm64 }}"

          with open('bucket/dotsider.json', 'r') as f:
              manifest = json.load(f)

          manifest['version'] = version
          manifest['architecture']['64bit']['url'] = f'https://github.com/willibrandon/dotsider/releases/download/v{version}/dotsider-win-x64.zip'
          manifest['architecture']['64bit']['hash'] = sha_win_x64
          manifest['architecture']['arm64']['url'] = f'https://github.com/willibrandon/dotsider/releases/download/v{version}/dotsider-win-arm64.zip'
          manifest['architecture']['arm64']['hash'] = sha_win_arm64

          with open('bucket/dotsider.json', 'w') as f:
              json.dump(manifest, f, indent=4)
              f.write('\n')

          # Update dotsider-mcp manifest
          sha_mcp_win_x64 = "${{ needs.create-release.outputs.sha256_mcp_win_x64 }}"
          sha_mcp_win_arm64 = "${{ needs.create-release.outputs.sha256_mcp_win_arm64 }}"

          with open('bucket/dotsider-mcp.json', 'r') as f:
              manifest = json.load(f)

          manifest['version'] = version
          manifest['architecture']['64bit']['url'] = f'https://github.com/willibrandon/dotsider/releases/download/v{version}/dotsider-mcp-win-x64.zip'
          manifest['architecture']['64bit']['hash'] = sha_mcp_win_x64
          manifest['architecture']['arm64']['url'] = f'https://github.com/willibrandon/dotsider/releases/download/v{version}/dotsider-mcp-win-arm64.zip'
          manifest['architecture']['arm64']['hash'] = sha_mcp_win_arm64

          with open('bucket/dotsider-mcp.json', 'w') as f:
              json.dump(manifest, f, indent=4)
              f.write('\n')
          EOF

          echo "Updated bucket/dotsider.json:"
          cat bucket/dotsider.json
          echo ""
          echo "Updated bucket/dotsider-mcp.json:"
          cat bucket/dotsider-mcp.json

      - name: Commit and push changes
        run: |
          cd scoop-bucket
          VERSION="${{ steps.version.outputs.version }}"

          git add bucket/dotsider.json bucket/dotsider-mcp.json
          git diff --staged --quiet || git commit -m "Update dotsider and dotsider-mcp to $VERSION"
          git push origin main

  update-winget:
    needs: create-release
    if: "!contains(github.ref_name, '-')"
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check if dotsider package exists in winget-pkgs
        id: check
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/w/willibrandon/dotsider" -Method Head -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Check if dotsider-mcp package exists in winget-pkgs
        id: check_mcp
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/w/willibrandon/dotsider-mcp" -Method Head -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      # --- dotsider winget submission ---

      - name: Generate dotsider winget manifest (update existing)
        if: steps.check.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $urlX64 = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-win-x64.msi"
          $urlArm64 = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-win-arm64.msi"

          .\wingetcreate.exe update willibrandon.dotsider `
            --version $version `
            --urls $urlX64 $urlArm64 `
            --token $env:GH_TOKEN `
            --out manifests

      - name: Generate dotsider winget manifest (new package)
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          # Use checked-in manifest templates
          $manifestDir = "manifests/w/willibrandon/dotsider/$version"
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          Copy-Item winget/willibrandon.dotsider.yaml $manifestDir/
          Copy-Item winget/willibrandon.dotsider.installer.yaml $manifestDir/
          Copy-Item winget/willibrandon.dotsider.locale.en-US.yaml $manifestDir/

          # Update version and URL in copied manifests
          Get-ChildItem $manifestDir -Filter *.yaml | ForEach-Object {
            (Get-Content $_.FullName) -replace '0\.3\.0', $version | Set-Content $_.FullName
          }
          $installerYaml = "$manifestDir/willibrandon.dotsider.installer.yaml"
          (Get-Content $installerYaml) -replace 'v0\.3\.0', "v$version" | Set-Content $installerYaml

          # Process both architectures
          $archs = @(
            @{ Rid = 'x64'; ShaSuffix = 'X64'; PcSuffix = 'X64' },
            @{ Rid = 'arm64'; ShaSuffix = 'ARM64'; PcSuffix = 'ARM64' }
          )
          foreach ($arch in $archs) {
            $url = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-win-$($arch.Rid).msi"
            $msiFile = New-TemporaryFile
            Invoke-WebRequest -Uri $url -OutFile $msiFile.FullName

            $sha256 = (Get-FileHash $msiFile.FullName -Algorithm SHA256).Hash
            (Get-Content $installerYaml) -replace "PLACEHOLDER_SHA256_$($arch.ShaSuffix)", $sha256 | Set-Content $installerYaml

            $pattern = 'ProductCode(\{[0-9a-fA-F-]{36}\})'
            $stream = [System.IO.File]::OpenRead($msiFile.FullName)
            $reader = [System.IO.StreamReader]::New($stream, [System.Text.Encoding]::ASCII)
            $productCode = $null
            while ($null -ne ($line = $reader.ReadLine())) {
              if ($line -match $pattern) {
                $productCode = $Matches[1]
                break
              }
            }
            $reader.Close()
            $stream.Close()
            Remove-Item $msiFile.FullName

            if ($productCode) {
              (Get-Content $installerYaml) -replace "\{PLACEHOLDER_PRODUCT_CODE_$($arch.PcSuffix)\}", $productCode | Set-Content $installerYaml
            }
          }

          Write-Host "Generated dotsider manifests:"
          Get-ChildItem $manifestDir | ForEach-Object { Write-Host $_.Name }

      # --- dotsider-mcp winget submission ---

      - name: Generate dotsider-mcp winget manifest (update existing)
        if: steps.check_mcp.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $urlX64 = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-mcp-win-x64.msi"
          $urlArm64 = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-mcp-win-arm64.msi"

          .\wingetcreate.exe update willibrandon.dotsider-mcp `
            --version $version `
            --urls $urlX64 $urlArm64 `
            --token $env:GH_TOKEN `
            --out manifests-mcp

      - name: Generate dotsider-mcp winget manifest (new package)
        if: steps.check_mcp.outputs.exists == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          # Use checked-in manifest templates
          $manifestDir = "manifests-mcp/w/willibrandon/dotsider-mcp/$version"
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          Copy-Item winget/willibrandon.dotsider-mcp.yaml $manifestDir/
          Copy-Item winget/willibrandon.dotsider-mcp.installer.yaml $manifestDir/
          Copy-Item winget/willibrandon.dotsider-mcp.locale.en-US.yaml $manifestDir/

          # Update version and URL in copied manifests
          Get-ChildItem $manifestDir -Filter *.yaml | ForEach-Object {
            (Get-Content $_.FullName) -replace '0\.3\.0', $version | Set-Content $_.FullName
          }
          $installerYaml = "$manifestDir/willibrandon.dotsider-mcp.installer.yaml"
          (Get-Content $installerYaml) -replace 'v0\.3\.0', "v$version" | Set-Content $installerYaml

          # Process both architectures
          $archs = @(
            @{ Rid = 'x64'; ShaSuffix = 'X64'; PcSuffix = 'X64' },
            @{ Rid = 'arm64'; ShaSuffix = 'ARM64'; PcSuffix = 'ARM64' }
          )
          foreach ($arch in $archs) {
            $url = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-mcp-win-$($arch.Rid).msi"
            $msiFile = New-TemporaryFile
            Invoke-WebRequest -Uri $url -OutFile $msiFile.FullName

            $sha256 = (Get-FileHash $msiFile.FullName -Algorithm SHA256).Hash
            (Get-Content $installerYaml) -replace "PLACEHOLDER_SHA256_$($arch.ShaSuffix)", $sha256 | Set-Content $installerYaml

            $pattern = 'ProductCode(\{[0-9a-fA-F-]{36}\})'
            $stream = [System.IO.File]::OpenRead($msiFile.FullName)
            $reader = [System.IO.StreamReader]::New($stream, [System.Text.Encoding]::ASCII)
            $productCode = $null
            while ($null -ne ($line = $reader.ReadLine())) {
              if ($line -match $pattern) {
                $productCode = $Matches[1]
                break
              }
            }
            $reader.Close()
            $stream.Close()
            Remove-Item $msiFile.FullName

            if ($productCode) {
              (Get-Content $installerYaml) -replace "\{PLACEHOLDER_PRODUCT_CODE_$($arch.PcSuffix)\}", $productCode | Set-Content $installerYaml
            }
          }

          Write-Host "Generated dotsider-mcp manifests:"
          Get-ChildItem $manifestDir | ForEach-Object { Write-Host $_.Name }

      - name: Submit dotsider winget PR via GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $branch = "dotsider-$version"
          $manifestDir = "manifests/w/willibrandon/dotsider/$version"

          function Upsert-WingetBranch {
            param(
              [Parameter(Mandatory=$true)][string]$Branch,
              [Parameter(Mandatory=$true)][string]$Sha
            )

            $refPath = "heads/$Branch"
            $updated = $false
            for ($attempt = 1; $attempt -le 3 -and -not $updated; $attempt++) {
              gh api "repos/willibrandon/winget-pkgs/git/ref/$refPath" --silent 2>$null
              if ($LASTEXITCODE -eq 0) {
                gh api "repos/willibrandon/winget-pkgs/git/refs/$refPath" -X PATCH -f sha="$Sha" -F force=true --silent
              } else {
                gh api repos/willibrandon/winget-pkgs/git/refs -X POST -f ref="refs/$refPath" -f sha="$Sha" --silent
              }

              $updated = $LASTEXITCODE -eq 0
              if (-not $updated -and $attempt -lt 3) {
                Write-Host "Winget branch upsert failed on attempt $attempt; retrying..."
                Start-Sleep -Seconds 2
              }
            }

            if (-not $updated) {
              throw "Failed to create or update winget branch $Branch"
            }

            $resolvedSha = gh api "repos/willibrandon/winget-pkgs/git/ref/$refPath" --jq '.object.sha'
            if ($LASTEXITCODE -ne 0 -or $resolvedSha -ne $Sha) {
              throw "Winget branch $Branch points to $resolvedSha, expected $Sha"
            }

            Write-Host "Branch $Branch updated to $Sha"
          }

          function New-WingetPullRequest {
            param(
              [Parameter(Mandatory=$true)][string]$Branch,
              [Parameter(Mandatory=$true)][string]$Title,
              [Parameter(Mandatory=$true)][string]$Body
            )

            $existingJson = gh api "repos/microsoft/winget-pkgs/pulls?state=open&head=willibrandon:$Branch&base=master" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $existing = $existingJson | ConvertFrom-Json | Select-Object -First 1
              if ($existing) {
                Write-Host "Winget PR already exists: $($existing.html_url)"
                return
              }
            }

            @{
              title = $Title
              head = "willibrandon:$Branch"
              base = "master"
              body = $Body
              maintainer_can_modify = $true
            } | ConvertTo-Json -Compress | Out-File -FilePath winget-pr.json -Encoding utf8NoBOM

            $prUrl = gh api repos/microsoft/winget-pkgs/pulls -X POST --input winget-pr.json --jq '.html_url'
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create winget PR for $Branch"
            }

            Write-Host "Created winget PR: $prUrl"
          }

          Write-Host "Syncing fork with upstream..."
          gh api repos/willibrandon/winget-pkgs/merge-upstream -X POST -f branch="master"

          $forkRef = gh api repos/willibrandon/winget-pkgs/git/ref/heads/master --jq '.object.sha'
          Write-Host "Fork master SHA: $forkRef"

          $baseTreeSha = gh api "repos/willibrandon/winget-pkgs/git/commits/$forkRef" --jq '.tree.sha'
          Write-Host "Base tree SHA: $baseTreeSha"

          $treeEntries = [System.Collections.ArrayList]@()
          Get-ChildItem -Path "manifests" -Recurse -File | ForEach-Object {
            $content = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($_.FullName))
            $blobResponse = gh api repos/willibrandon/winget-pkgs/git/blobs -X POST -f content="$content" -f encoding="base64"
            $blobSha = $blobResponse | ConvertFrom-Json | Select-Object -ExpandProperty sha
            $path = "$manifestDir/$($_.Name)"
            Write-Host "Created blob for $path : $blobSha"
            [void]$treeEntries.Add(@{path=$path; mode="100644"; type="blob"; sha=$blobSha})
          }

          $treeData = @{base_tree=$baseTreeSha; tree=$treeEntries.ToArray()}
          $treeJson = $treeData | ConvertTo-Json -Depth 10
          Write-Host "Tree JSON: $treeJson"
          $treeJson | Out-File -FilePath tree.json -Encoding utf8NoBOM
          $newTree = gh api repos/willibrandon/winget-pkgs/git/trees -X POST --input tree.json
          $newTreeSha = $newTree | ConvertFrom-Json | Select-Object -ExpandProperty sha
          Write-Host "New tree SHA: $newTreeSha"
          if ($newTreeSha -eq $baseTreeSha) {
            Write-Host "No dotsider winget manifest changes to submit."
            exit 0
          }

          $commitJson = @{
            message="Update willibrandon.dotsider to $version [skip actions]"
            tree=$newTreeSha
            parents=@($forkRef)
          } | ConvertTo-Json -Compress
          $commitJson | Out-File -FilePath commit.json -Encoding utf8
          $newCommit = gh api repos/willibrandon/winget-pkgs/git/commits -X POST --input commit.json
          $newCommitSha = $newCommit | ConvertFrom-Json | Select-Object -ExpandProperty sha
          Write-Host "New commit SHA: $newCommitSha"

          Upsert-WingetBranch -Branch $branch -Sha $newCommitSha

          $exists = "${{ steps.check.outputs.exists }}"
          if ($exists -eq "true") {
            $prTitle = "Update willibrandon.dotsider to $version"
            $prBody = "## Description`n`nUpdate dotsider to version $version`n`n## Release notes`n`nhttps://github.com/willibrandon/dotsider/releases/tag/v$version"
          } else {
            $prTitle = "New package: willibrandon.dotsider $version"
            $prBody = "## Description`n`nAdd dotsider version $version`n`n## Release notes`n`nhttps://github.com/willibrandon/dotsider/releases/tag/v$version"
          }

          New-WingetPullRequest -Branch $branch -Title $prTitle -Body $prBody

      - name: Submit dotsider-mcp winget PR via GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $branch = "dotsider-mcp-$version"
          $manifestDir = "manifests-mcp/w/willibrandon/dotsider-mcp/$version"

