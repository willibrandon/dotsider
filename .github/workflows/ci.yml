name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        shell: bash
        run: |
          set -euo pipefail

          for project in \
            tests/Dotsider.Tests/Dotsider.Tests.csproj \
            tests/Dotsider.Mcp.Tests/Dotsider.Mcp.Tests.csproj \
            tests/Dotsider.Website.Tests/Dotsider.Website.Tests.csproj
          do
            dotnet test "$project" --no-build --report-trx --results-directory "TestResults/${{ matrix.os }}/$(basename "$(dirname "$project")")" --coverage --coverage-output-format cobertura
          done

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/*.cobertura.xml

  deploy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run deploy tests
        run: bash tests/deploy/run.sh
