          git diff --staged --quiet || git commit -m "Update dotsider and dotsider-mcp to $VERSION"
          git push origin main

  update-winget:
    needs: create-release
    if: "!contains(github.ref_name, '-')"
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check if dotsider package exists in winget-pkgs
        id: check
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/w/willibrandon/dotsider" -Method Head -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Check if dotsider-mcp package exists in winget-pkgs
        id: check_mcp
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/w/willibrandon/dotsider-mcp" -Method Head -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      # --- dotsider winget submission ---

      - name: Generate dotsider winget manifest (update existing)
        if: steps.check.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $urlX64 = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-win-x64.msi"
          $urlArm64 = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-win-arm64.msi"

          .\wingetcreate.exe update willibrandon.dotsider `
            --version $version `
            --urls $urlX64 $urlArm64 `
            --token $env:GH_TOKEN `
            --out manifests

      - name: Generate dotsider winget manifest (new package)
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          # Use checked-in manifest templates
          $manifestDir = "manifests/w/willibrandon/dotsider/$version"
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          Copy-Item winget/willibrandon.dotsider.yaml $manifestDir/
          Copy-Item winget/willibrandon.dotsider.installer.yaml $manifestDir/
          Copy-Item winget/willibrandon.dotsider.locale.en-US.yaml $manifestDir/

          # Update version and URL in copied manifests
          Get-ChildItem $manifestDir -Filter *.yaml | ForEach-Object {
            (Get-Content $_.FullName) -replace '0\.3\.0', $version | Set-Content $_.FullName
          }
          $installerYaml = "$manifestDir/willibrandon.dotsider.installer.yaml"
          (Get-Content $installerYaml) -replace 'v0\.3\.0', "v$version" | Set-Content $installerYaml

          # Process both architectures
          $archs = @(
            @{ Rid = 'x64'; ShaSuffix = 'X64'; PcSuffix = 'X64' },
            @{ Rid = 'arm64'; ShaSuffix = 'ARM64'; PcSuffix = 'ARM64' }
          )
          foreach ($arch in $archs) {
            $url = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-win-$($arch.Rid).msi"
            $msiFile = New-TemporaryFile
            Invoke-WebRequest -Uri $url -OutFile $msiFile.FullName

            $sha256 = (Get-FileHash $msiFile.FullName -Algorithm SHA256).Hash
            (Get-Content $installerYaml) -replace "PLACEHOLDER_SHA256_$($arch.ShaSuffix)", $sha256 | Set-Content $installerYaml

            $pattern = 'ProductCode(\{[0-9a-fA-F-]{36}\})'
            $stream = [System.IO.File]::OpenRead($msiFile.FullName)
            $reader = [System.IO.StreamReader]::New($stream, [System.Text.Encoding]::ASCII)
            $productCode = $null
            while ($null -ne ($line = $reader.ReadLine())) {
              if ($line -match $pattern) {
                $productCode = $Matches[1]
                break
              }
            }
            $reader.Close()
            $stream.Close()
            Remove-Item $msiFile.FullName

            if ($productCode) {
              (Get-Content $installerYaml) -replace "\{PLACEHOLDER_PRODUCT_CODE_$($arch.PcSuffix)\}", $productCode | Set-Content $installerYaml
            }
          }

          Write-Host "Generated dotsider manifests:"
          Get-ChildItem $manifestDir | ForEach-Object { Write-Host $_.Name }

      # --- dotsider-mcp winget submission ---

      - name: Generate dotsider-mcp winget manifest (update existing)
        if: steps.check_mcp.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $urlX64 = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-mcp-win-x64.msi"
          $urlArm64 = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-mcp-win-arm64.msi"

          .\wingetcreate.exe update willibrandon.dotsider-mcp `
            --version $version `
            --urls $urlX64 $urlArm64 `
            --token $env:GH_TOKEN `
            --out manifests-mcp

      - name: Generate dotsider-mcp winget manifest (new package)
        if: steps.check_mcp.outputs.exists == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          # Use checked-in manifest templates
          $manifestDir = "manifests-mcp/w/willibrandon/dotsider-mcp/$version"
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          Copy-Item winget/willibrandon.dotsider-mcp.yaml $manifestDir/
          Copy-Item winget/willibrandon.dotsider-mcp.installer.yaml $manifestDir/
          Copy-Item winget/willibrandon.dotsider-mcp.locale.en-US.yaml $manifestDir/

          # Update version and URL in copied manifests
          Get-ChildItem $manifestDir -Filter *.yaml | ForEach-Object {
            (Get-Content $_.FullName) -replace '0\.3\.0', $version | Set-Content $_.FullName
          }
          $installerYaml = "$manifestDir/willibrandon.dotsider-mcp.installer.yaml"
          (Get-Content $installerYaml) -replace 'v0\.3\.0', "v$version" | Set-Content $installerYaml

          # Process both architectures
          $archs = @(
            @{ Rid = 'x64'; ShaSuffix = 'X64'; PcSuffix = 'X64' },
            @{ Rid = 'arm64'; ShaSuffix = 'ARM64'; PcSuffix = 'ARM64' }
          )
          foreach ($arch in $archs) {
            $url = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-mcp-win-$($arch.Rid).msi"
            $msiFile = New-TemporaryFile
            Invoke-WebRequest -Uri $url -OutFile $msiFile.FullName

            $sha256 = (Get-FileHash $msiFile.FullName -Algorithm SHA256).Hash
            (Get-Content $installerYaml) -replace "PLACEHOLDER_SHA256_$($arch.ShaSuffix)", $sha256 | Set-Content $installerYaml

            $pattern = 'ProductCode(\{[0-9a-fA-F-]{36}\})'
            $stream = [System.IO.File]::OpenRead($msiFile.FullName)
            $reader = [System.IO.StreamReader]::New($stream, [System.Text.Encoding]::ASCII)
            $productCode = $null
            while ($null -ne ($line = $reader.ReadLine())) {
              if ($line -match $pattern) {
                $productCode = $Matches[1]
                break
              }
            }
            $reader.Close()
            $stream.Close()
            Remove-Item $msiFile.FullName

            if ($productCode) {
              (Get-Content $installerYaml) -replace "\{PLACEHOLDER_PRODUCT_CODE_$($arch.PcSuffix)\}", $productCode | Set-Content $installerYaml
            }
          }

          Write-Host "Generated dotsider-mcp manifests:"
          Get-ChildItem $manifestDir | ForEach-Object { Write-Host $_.Name }

      - name: Submit dotsider winget PR via GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $branch = "dotsider-$version"
          $manifestDir = "manifests/w/willibrandon/dotsider/$version"

          function Upsert-WingetBranch {
            param(
              [Parameter(Mandatory=$true)][string]$Branch,
              [Parameter(Mandatory=$true)][string]$Sha
            )

            $refPath = "heads/$Branch"
            $updated = $false
            for ($attempt = 1; $attempt -le 3 -and -not $updated; $attempt++) {
              gh api "repos/willibrandon/winget-pkgs/git/ref/$refPath" --silent 2>$null
              if ($LASTEXITCODE -eq 0) {
                gh api "repos/willibrandon/winget-pkgs/git/refs/$refPath" -X PATCH -f sha="$Sha" -F force=true --silent
              } else {
                gh api repos/willibrandon/winget-pkgs/git/refs -X POST -f ref="refs/$refPath" -f sha="$Sha" --silent
              }

              $updated = $LASTEXITCODE -eq 0
              if (-not $updated -and $attempt -lt 3) {
                Write-Host "Winget branch upsert failed on attempt $attempt; retrying..."
                Start-Sleep -Seconds 2
              }
            }

            if (-not $updated) {
              throw "Failed to create or update winget branch $Branch"
            }

            $resolvedSha = $null
            $resolvedExitCode = 1
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              $resolvedSha = $null
              $resolvedSha = gh api "repos/willibrandon/winget-pkgs/git/ref/$refPath" --jq '.object.sha' 2>$null
              $resolvedExitCode = $LASTEXITCODE
              if ($resolvedExitCode -eq 0 -and $resolvedSha -eq $Sha) {
                break
              }

              if ($attempt -lt 5) {
                Write-Host "Winget branch $Branch has not resolved to $Sha yet; retrying..."
                Start-Sleep -Seconds 2
              }
            }

            if ($resolvedExitCode -ne 0 -or $resolvedSha -ne $Sha) {
              throw "Winget branch $Branch points to $resolvedSha, expected $Sha"
            }

            Write-Host "Branch $Branch updated to $Sha"
          }

          function New-WingetPullRequest {
            param(
              [Parameter(Mandatory=$true)][string]$Branch,
              [Parameter(Mandatory=$true)][string]$Title,
              [Parameter(Mandatory=$true)][string]$Body
            )

            $existingJson = gh api "repos/microsoft/winget-pkgs/pulls?state=open&head=willibrandon:$Branch&base=master" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $existing = $existingJson | ConvertFrom-Json | Select-Object -First 1
              if ($existing) {
                Write-Host "Winget PR already exists: $($existing.html_url)"
                return
              }
            }

            @{
              title = $Title
              head = "willibrandon:$Branch"
              base = "master"
              body = $Body
              maintainer_can_modify = $true
            } | ConvertTo-Json -Compress | Out-File -FilePath winget-pr.json -Encoding utf8NoBOM

            $prUrl = gh api repos/microsoft/winget-pkgs/pulls -X POST --input winget-pr.json --jq '.html_url'
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create winget PR for $Branch"
            }

            Write-Host "Created winget PR: $prUrl"
          }

          Write-Host "Syncing fork with upstream..."
          gh api repos/willibrandon/winget-pkgs/merge-upstream -X POST -f branch="master"

          $forkRef = gh api repos/willibrandon/winget-pkgs/git/ref/heads/master --jq '.object.sha'
          Write-Host "Fork master SHA: $forkRef"

          $baseTreeSha = gh api "repos/willibrandon/winget-pkgs/git/commits/$forkRef" --jq '.tree.sha'
          Write-Host "Base tree SHA: $baseTreeSha"

          $treeEntries = [System.Collections.ArrayList]@()
          Get-ChildItem -Path "manifests" -Recurse -File | ForEach-Object {
            $content = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($_.FullName))
            $blobResponse = gh api repos/willibrandon/winget-pkgs/git/blobs -X POST -f content="$content" -f encoding="base64"
            $blobSha = $blobResponse | ConvertFrom-Json | Select-Object -ExpandProperty sha
            $path = "$manifestDir/$($_.Name)"
            Write-Host "Created blob for $path : $blobSha"
            [void]$treeEntries.Add(@{path=$path; mode="100644"; type="blob"; sha=$blobSha})
          }

          $treeData = @{base_tree=$baseTreeSha; tree=$treeEntries.ToArray()}
          $treeJson = $treeData | ConvertTo-Json -Depth 10
          Write-Host "Tree JSON: $treeJson"
          $treeJson | Out-File -FilePath tree.json -Encoding utf8NoBOM
          $newTree = gh api repos/willibrandon/winget-pkgs/git/trees -X POST --input tree.json
          $newTreeSha = $newTree | ConvertFrom-Json | Select-Object -ExpandProperty sha
          Write-Host "New tree SHA: $newTreeSha"
          if ($newTreeSha -eq $baseTreeSha) {
            Write-Host "No dotsider winget manifest changes to submit."
            exit 0
          }

          $commitJson = @{
            message="Update willibrandon.dotsider to $version [skip actions]"
            tree=$newTreeSha
            parents=@($forkRef)
          } | ConvertTo-Json -Compress
          $commitJson | Out-File -FilePath commit.json -Encoding utf8
          $newCommit = gh api repos/willibrandon/winget-pkgs/git/commits -X POST --input commit.json
          $newCommitSha = $newCommit | ConvertFrom-Json | Select-Object -ExpandProperty sha
          Write-Host "New commit SHA: $newCommitSha"

          Upsert-WingetBranch -Branch $branch -Sha $newCommitSha

          $exists = "${{ steps.check.outputs.exists }}"
          if ($exists -eq "true") {
            $prTitle = "Update willibrandon.dotsider to $version"
            $prBody = "## Description`n`nUpdate dotsider to version $version`n`n## Release notes`n`nhttps://github.com/willibrandon/dotsider/releases/tag/v$version"
          } else {
            $prTitle = "New package: willibrandon.dotsider $version"
            $prBody = "## Description`n`nAdd dotsider version $version`n`n## Release notes`n`nhttps://github.com/willibrandon/dotsider/releases/tag/v$version"
          }

          New-WingetPullRequest -Branch $branch -Title $prTitle -Body $prBody

      - name: Submit dotsider-mcp winget PR via GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $branch = "dotsider-mcp-$version"
          $manifestDir = "manifests-mcp/w/willibrandon/dotsider-mcp/$version"

          function Upsert-WingetBranch {
            param(
              [Parameter(Mandatory=$true)][string]$Branch,
              [Parameter(Mandatory=$true)][string]$Sha
            )

            $refPath = "heads/$Branch"
            $updated = $false
            for ($attempt = 1; $attempt -le 3 -and -not $updated; $attempt++) {
              gh api "repos/willibrandon/winget-pkgs/git/ref/$refPath" --silent 2>$null
              if ($LASTEXITCODE -eq 0) {
                gh api "repos/willibrandon/winget-pkgs/git/refs/$refPath" -X PATCH -f sha="$Sha" -F force=true --silent
              } else {
                gh api repos/willibrandon/winget-pkgs/git/refs -X POST -f ref="refs/$refPath" -f sha="$Sha" --silent
              }

              $updated = $LASTEXITCODE -eq 0
              if (-not $updated -and $attempt -lt 3) {
                Write-Host "Winget branch upsert failed on attempt $attempt; retrying..."
                Start-Sleep -Seconds 2
              }
            }

            if (-not $updated) {
              throw "Failed to create or update winget branch $Branch"
            }

            $resolvedSha = $null
            $resolvedExitCode = 1
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              $resolvedSha = $null
              $resolvedSha = gh api "repos/willibrandon/winget-pkgs/git/ref/$refPath" --jq '.object.sha' 2>$null
              $resolvedExitCode = $LASTEXITCODE
              if ($resolvedExitCode -eq 0 -and $resolvedSha -eq $Sha) {
                break
              }

              if ($attempt -lt 5) {
                Write-Host "Winget branch $Branch has not resolved to $Sha yet; retrying..."
                Start-Sleep -Seconds 2
              }
            }

            if ($resolvedExitCode -ne 0 -or $resolvedSha -ne $Sha) {
              throw "Winget branch $Branch points to $resolvedSha, expected $Sha"
            }

            Write-Host "Branch $Branch updated to $Sha"
          }

          function New-WingetPullRequest {
            param(
              [Parameter(Mandatory=$true)][string]$Branch,
              [Parameter(Mandatory=$true)][string]$Title,
              [Parameter(Mandatory=$true)][string]$Body
            )

            $existingJson = gh api "repos/microsoft/winget-pkgs/pulls?state=open&head=willibrandon:$Branch&base=master" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $existing = $existingJson | ConvertFrom-Json | Select-Object -First 1
              if ($existing) {
                Write-Host "Winget PR already exists: $($existing.html_url)"
                return
              }
            }

            @{
              title = $Title
              head = "willibrandon:$Branch"
              base = "master"
              body = $Body
              maintainer_can_modify = $true
            } | ConvertTo-Json -Compress | Out-File -FilePath winget-pr-mcp.json -Encoding utf8NoBOM

            $prUrl = gh api repos/microsoft/winget-pkgs/pulls -X POST --input winget-pr-mcp.json --jq '.html_url'
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create winget PR for $Branch"
            }

            Write-Host "Created winget PR: $prUrl"
          }

          $forkRef = gh api repos/willibrandon/winget-pkgs/git/ref/heads/master --jq '.object.sha'
          Write-Host "Fork master SHA: $forkRef"

          $baseTreeSha = gh api "repos/willibrandon/winget-pkgs/git/commits/$forkRef" --jq '.tree.sha'
          Write-Host "Base tree SHA: $baseTreeSha"

          $treeEntries = [System.Collections.ArrayList]@()
          Get-ChildItem -Path "manifests-mcp" -Recurse -File | ForEach-Object {
            $content = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($_.FullName))
            $blobResponse = gh api repos/willibrandon/winget-pkgs/git/blobs -X POST -f content="$content" -f encoding="base64"
            $blobSha = $blobResponse | ConvertFrom-Json | Select-Object -ExpandProperty sha
            $wingetPath = "manifests/w/willibrandon/dotsider-mcp/$version/$($_.Name)"
            Write-Host "Created blob for $wingetPath : $blobSha"
            [void]$treeEntries.Add(@{path=$wingetPath; mode="100644"; type="blob"; sha=$blobSha})
          }

          $treeData = @{base_tree=$baseTreeSha; tree=$treeEntries.ToArray()}
          $treeJson = $treeData | ConvertTo-Json -Depth 10
          Write-Host "Tree JSON: $treeJson"
          $treeJson | Out-File -FilePath tree-mcp.json -Encoding utf8NoBOM
          $newTree = gh api repos/willibrandon/winget-pkgs/git/trees -X POST --input tree-mcp.json
          $newTreeSha = $newTree | ConvertFrom-Json | Select-Object -ExpandProperty sha
          Write-Host "New tree SHA: $newTreeSha"
          if ($newTreeSha -eq $baseTreeSha) {
            Write-Host "No dotsider-mcp winget manifest changes to submit."
            exit 0
          }

          $commitJson = @{
            message="Update willibrandon.dotsider-mcp to $version [skip actions]"
            tree=$newTreeSha
            parents=@($forkRef)
          } | ConvertTo-Json -Compress
          $commitJson | Out-File -FilePath commit-mcp.json -Encoding utf8
          $newCommit = gh api repos/willibrandon/winget-pkgs/git/commits -X POST --input commit-mcp.json
          $newCommitSha = $newCommit | ConvertFrom-Json | Select-Object -ExpandProperty sha
          Write-Host "New commit SHA: $newCommitSha"

          Upsert-WingetBranch -Branch $branch -Sha $newCommitSha

          $exists = "${{ steps.check_mcp.outputs.exists }}"
          if ($exists -eq "true") {
            $prTitle = "Update willibrandon.dotsider-mcp to $version"
            $prBody = "## Description`n`nUpdate dotsider-mcp to version $version`n`n## Release notes`n`nhttps://github.com/willibrandon/dotsider/releases/tag/v$version"
          } else {
            $prTitle = "New package: willibrandon.dotsider-mcp $version"
            $prBody = "## Description`n`nAdd dotsider-mcp version $version`n`n## Release notes`n`nhttps://github.com/willibrandon/dotsider/releases/tag/v$version"
          }

          New-WingetPullRequest -Branch $branch -Title $prTitle -Body $prBody
