name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/Dotsider.Website/**'
      - 'src/Dotsider/**'
      - 'src/Dotsider.Core/**'
      - 'samples/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ── Build docs site ──────────────────────────────────────────
      # pnpm/action-setup goes first so its pinned binary (read from
      # docs/package.json's packageManager field) sits on PATH before
      # setup-node calls `pnpm store path` for cache resolution. Otherwise
      # the runner's system pnpm answers and the store paths diverge.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: docs

      - run: pnpm build
        working-directory: docs

      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/dist/

      # ── Build WebSocket server + sample assembly ─────────────────
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Dotsider.Website
        run: >
          dotnet publish src/Dotsider.Website/Dotsider.Website.csproj
          -c Release
          -r linux-x64
          --self-contained
          -p:PublishSingleFile=true
          -o ./publish/website

      - name: Publish sample assembly
        # Publish (not build) so the .deps.json and every NuGet dependency that
        # RichLibrary resolves at runtime ship together as a unit. Hand-copying
        # just RichLibrary.dll drifts every time the sample's package closure
        # changes — Newtonsoft.Json, any future deps, etc.
        run: >
          dotnet publish samples/RichLibrary/RichLibrary.csproj
          -c Release
          -r linux-x64
          -o ./publish/sample

      - name: Stage deploy unit files and scripts
        # The systemd units and helper scripts in deploy/ were only written to
        # the server once by setup.sh during VM bootstrap. Any subsequent change
        # (env vars, integrity logic, descriptions) has to be installed on the
        # server by the deploy itself, or running state drifts from the repo.
        run: |
          mkdir -p publish/deploy
          cp deploy/dotsider-website.service publish/deploy/
          cp deploy/integrity-check.service publish/deploy/
          cp deploy/integrity-check.timer publish/deploy/
          cp deploy/integrity-check.sh publish/deploy/
          cp deploy/caddy-report.sh publish/deploy/

      - uses: actions/upload-artifact@v7
        with:
          name: website-server
          path: publish/website/

      - uses: actions/upload-artifact@v7
        with:
          name: website-sample
          path: publish/sample/

      - uses: actions/upload-artifact@v7
        with:
          name: deploy-files
          path: publish/deploy/

  preflight:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run preflight checks
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/deploy_key deploy/preflight.sh brandon@"$HOST":/tmp/preflight.sh
          ssh -i ~/.ssh/deploy_key brandon@"$HOST" 'bash /tmp/preflight.sh'

  deploy:
    needs: [build, preflight]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dotsider.dev
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: docs-site/

      - uses: actions/download-artifact@v8
        with:
          name: website-server
          path: website-server/

      - uses: actions/download-artifact@v8
        with:
          name: website-sample
          path: website-sample/

      - uses: actions/download-artifact@v8
        with:
          name: deploy-files
          path: deploy-files/

      - name: Setup SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy docs site
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: >
          rsync -avz --delete
          -e "ssh -i ~/.ssh/deploy_key"
          docs-site/
          brandon@"$HOST":/var/www/dotsider-docs/

      - name: Pause integrity checker and deploy website server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key brandon@"$HOST" \
            'sudo systemctl stop integrity-check.timer integrity-check.service 2>/dev/null || true'

          # Website binary. Exclude the sample payload and its backups/manifest
          # so a website-only rsync doesn't wipe them out.
          rsync -avz --delete --chmod=F755 \
            --exclude='caddy-report.sh' \
            --exclude='integrity-check.sh' \
            --exclude='sample/' \
            --exclude='sample.bak/' \
            --exclude='sample.sha256' \
            -e "ssh -i ~/.ssh/deploy_key" \
            website-server/ \
            brandon@"$HOST":/opt/dotsider-website/

          # Sample payload shipped as a directory unit. RichLibrary.dll,
          # RichLibrary.deps.json, and Newtonsoft.Json.dll (plus any future
          # package deps) travel together and are verified together.
          rsync -avz --delete --chmod=F644 \
            -e "ssh -i ~/.ssh/deploy_key" \
            website-sample/ \
            brandon@"$HOST":/opt/dotsider-website/sample/

          # Deploy helper scripts into /opt/dotsider-website/ and the updated
          # systemd units into /etc/systemd/system/. Without this step the
          # running service keeps whatever env vars and scripts setup.sh wrote
          # at VM bootstrap — any change here (new env var paths, integrity
          # logic, timer descriptions) silently never reaches the server.
          rsync -avz --chmod=F755 \
            -e "ssh -i ~/.ssh/deploy_key" \
            deploy-files/integrity-check.sh \
            deploy-files/caddy-report.sh \
            brandon@"$HOST":/opt/dotsider-website/

          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            deploy-files/dotsider-website.service \
            deploy-files/integrity-check.service \
            deploy-files/integrity-check.timer \
            brandon@"$HOST":/tmp/

          ssh -i ~/.ssh/deploy_key brandon@"$HOST" bash -s << 'REMOTE'
            set -euo pipefail
            cd /opt/dotsider-website

            sudo install -m 0644 /tmp/dotsider-website.service /etc/systemd/system/
            sudo install -m 0644 /tmp/integrity-check.service  /etc/systemd/system/
            sudo install -m 0644 /tmp/integrity-check.timer    /etc/systemd/system/
            rm -f /tmp/dotsider-website.service \
                  /tmp/integrity-check.service \
                  /tmp/integrity-check.timer
            sudo systemctl daemon-reload

            rm -rf sample.bak
            cp -a sample sample.bak
            # Manifest: one "<sha256>  <relative-path>" per file, sorted.
            (cd sample && find . -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum) > sample.sha256

            # Clear the legacy single-file hash guard from the previous
            # deploy shape so the integrity checker doesn't trip on stale
            # artifacts from the pre-sample-dir layout.
            rm -f .RichLibrary.dll.bak .RichLibrary.dll.sha256

            sudo systemctl start integrity-check.timer
          REMOTE

      - name: Restart and verify
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key brandon@"$HOST" bash -s << 'REMOTE'
            sudo systemctl restart dotsider-website
            sleep 2
            sudo systemctl status dotsider-website --no-pager
            curl -sf http://localhost:5100/health || (echo "Health check failed" && exit 1)
          REMOTE
