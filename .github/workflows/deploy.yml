name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/Dotsider.Website/**'
      - 'src/Dotsider/**'
      - 'src/Dotsider.Core/**'
      - 'samples/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ── Build docs site ──────────────────────────────────────────
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: docs

      - run: pnpm build
        working-directory: docs

      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/dist/

      # ── Build WebSocket server + sample assembly ─────────────────
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Dotsider.Website
        run: >
          dotnet publish src/Dotsider.Website/Dotsider.Website.csproj
          -c Release
          -r linux-x64
          --self-contained
          -p:PublishSingleFile=true
          -o ./publish/website

      - name: Build sample assembly
        run: dotnet build samples/RichLibrary/RichLibrary.csproj -c Release

      - name: Copy sample assembly
        run: cp samples/RichLibrary/bin/Release/net10.0/RichLibrary.dll ./publish/website/

      - uses: actions/upload-artifact@v7
        with:
          name: website-server
          path: publish/website/

  preflight:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run preflight checks
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/deploy_key deploy/preflight.sh brandon@"$HOST":/tmp/preflight.sh
          ssh -i ~/.ssh/deploy_key brandon@"$HOST" 'bash /tmp/preflight.sh'

  deploy:
    needs: [build, preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: docs-site/

      - uses: actions/download-artifact@v8
        with:
          name: website-server
          path: website-server/

      - name: Setup SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy docs site
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: >
          rsync -avz --delete
          -e "ssh -i ~/.ssh/deploy_key"
          docs-site/
          brandon@"$HOST":/var/www/dotsider-docs/

      - name: Pause integrity checker and deploy website server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key brandon@"$HOST" \
            'sudo systemctl stop integrity-check.timer integrity-check.service 2>/dev/null || true'

          rsync -avz --delete --chmod=F755 \
            --exclude='caddy-report.sh' \
            --exclude='integrity-check.sh' \
            --exclude='.RichLibrary.dll.bak' \
            --exclude='.RichLibrary.dll.sha256' \
            -e "ssh -i ~/.ssh/deploy_key" \
            website-server/ \
            brandon@"$HOST":/opt/dotsider-website/

          ssh -i ~/.ssh/deploy_key brandon@"$HOST" bash -s << 'REMOTE'
            cd /opt/dotsider-website
            cp RichLibrary.dll .RichLibrary.dll.bak
            sha256sum RichLibrary.dll | cut -d' ' -f1 > .RichLibrary.dll.sha256
            sudo systemctl start integrity-check.timer
          REMOTE

      - name: Restart and verify
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key brandon@"$HOST" bash -s << 'REMOTE'
            sudo systemctl restart dotsider-website
            sleep 2
            sudo systemctl status dotsider-website --no-pager
            curl -sf http://localhost:5100/health || (echo "Health check failed" && exit 1)
          REMOTE
