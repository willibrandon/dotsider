name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build-portable-packages:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Download Native AOT tool packages
        uses: actions/download-artifact@v8
        with:
          pattern: tool-packages-*
          path: ./nupkg
          merge-multiple: true

      - name: Pack pointer and fallback packages
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet pack src/Dotsider/Dotsider.csproj -c Release -p:Version=$version -p:PackageVersion=$version -o ./nupkg
          if ($LASTEXITCODE -ne 0) { throw 'Failed to pack the dotsider pointer package.' }
          dotnet pack src/Dotsider/Dotsider.csproj -c Release -r any -p:PublishAot=false -p:Version=$version -p:PackageVersion=$version -o ./nupkg
          if ($LASTEXITCODE -ne 0) { throw 'Failed to pack the dotsider fallback package.' }
          dotnet pack src/Dotsider.Mcp/Dotsider.Mcp.csproj -c Release -p:Version=$version -p:PackageVersion=$version -o ./nupkg
          if ($LASTEXITCODE -ne 0) { throw 'Failed to pack the dotsider-mcp pointer package.' }
          dotnet pack src/Dotsider.Mcp/Dotsider.Mcp.csproj -c Release -r any -p:PublishAot=false -p:Version=$version -p:PackageVersion=$version -o ./nupkg
          if ($LASTEXITCODE -ne 0) { throw 'Failed to pack the dotsider-mcp fallback package.' }

      - name: Verify installation through pointer packages
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $source = (Resolve-Path ./nupkg).Path
          dotnet tool install Dotsider --tool-path ./tool-smoke/dotsider --version $version --add-source $source --no-cache --ignore-failed-sources
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install dotsider through its pointer package.' }
          dotnet tool install Dotsider.Mcp --tool-path ./tool-smoke/dotsider-mcp --version $version --add-source $source --no-cache --ignore-failed-sources
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install dotsider-mcp through its pointer package.' }
          & ./tool-smoke/dotsider/dotsider --version
          if ($LASTEXITCODE -ne 0) { throw 'The installed dotsider tool did not run.' }
          & ./tool-smoke/dotsider-mcp/dotsider-mcp --version
          if ($LASTEXITCODE -ne 0) { throw 'The installed dotsider-mcp tool did not run.' }

      - name: Upload portable tool packages
        uses: actions/upload-artifact@v7
        with:
          name: tool-packages-portable
          path: ./nupkg/*.nupkg
          if-no-files-found: error

  publish-nuget:
    needs: [build-binaries, build-portable-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Download tool packages
        uses: actions/download-artifact@v8
        with:
          pattern: tool-packages-*
          path: ./nupkg
          merge-multiple: true

      - name: Push implementation packages before pointer packages
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $source = 'https://api.nuget.org/v3/index.json'
          $implementationIds = @(
            'Dotsider.any', 'Dotsider.win-x64', 'Dotsider.win-arm64',
            'Dotsider.linux-x64', 'Dotsider.linux-arm64',
            'Dotsider.linux-musl-x64', 'Dotsider.linux-musl-arm64',
            'Dotsider.osx-x64', 'Dotsider.osx-arm64',
            'Dotsider.Mcp.any', 'Dotsider.Mcp.win-x64', 'Dotsider.Mcp.win-arm64',
            'Dotsider.Mcp.linux-x64', 'Dotsider.Mcp.linux-arm64',
            'Dotsider.Mcp.linux-musl-x64', 'Dotsider.Mcp.linux-musl-arm64',
            'Dotsider.Mcp.osx-x64', 'Dotsider.Mcp.osx-arm64'
          )
          foreach ($id in $implementationIds) {
            $package = Join-Path ./nupkg "$id.$version.nupkg"
            if (!(Test-Path -LiteralPath $package -PathType Leaf)) { throw "Missing package $package" }
            dotnet nuget push $package --api-key '${{ secrets.NUGET_API_KEY }}' --source $source --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Failed to push $package" }
          }
          foreach ($id in @('Dotsider', 'Dotsider.Mcp')) {
            $package = Join-Path ./nupkg "$id.$version.nupkg"
            if (!(Test-Path -LiteralPath $package -PathType Leaf)) { throw "Missing package $package" }
            dotnet nuget push $package --api-key '${{ secrets.NUGET_API_KEY }}' --source $source --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Failed to push $package" }
          }

  build-binaries:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            artifact: dotsider-win-x64
            arch: x64
          - rid: win-arm64
            os: windows-11-arm
            artifact: dotsider-win-arm64
            arch: arm64
          - rid: linux-x64
            os: ubuntu-latest
            artifact: dotsider-linux-x64
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            artifact: dotsider-linux-arm64
          - rid: linux-musl-x64
            os: ubuntu-latest
            artifact: dotsider-linux-musl-x64
          - rid: linux-musl-arm64
            os: ubuntu-24.04-arm
            artifact: dotsider-linux-musl-arm64
          - rid: osx-x64
            os: macos-26-intel
            artifact: dotsider-osx-x64
          - rid: osx-arm64
            os: macos-26
            artifact: dotsider-osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Publish, test, and pack Native AOT applications
        run: >-
          dotnet run --file ./scripts/Verify-NativeAot.cs --
          -Mode Release
          -Rid ${{ matrix.rid }}
          -Version ${{ github.ref_name }}

      - name: Upload dotsider artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ./artifacts/native-aot-release/${{ matrix.rid }}/publish/dotsider/**
          if-no-files-found: error

      - name: Upload dotsider-mcp artifact
        uses: actions/upload-artifact@v7
        with:
          name: dotsider-mcp-${{ matrix.rid }}
          path: ./artifacts/native-aot-release/${{ matrix.rid }}/publish/dotsider-mcp/**
          if-no-files-found: error

      - name: Upload dotsider symbols
        uses: actions/upload-artifact@v7
        with:
          name: dotsider-${{ matrix.rid }}-symbols
          path: ./artifacts/native-aot-release/${{ matrix.rid }}/symbols/dotsider/**
          if-no-files-found: error

      - name: Upload dotsider-mcp symbols
        uses: actions/upload-artifact@v7
        with:
          name: dotsider-mcp-${{ matrix.rid }}-symbols
          path: ./artifacts/native-aot-release/${{ matrix.rid }}/symbols/dotsider-mcp/**
          if-no-files-found: error

      - name: Upload Native AOT tool packages
        uses: actions/upload-artifact@v7
        with:
          name: tool-packages-${{ matrix.rid }}
          path: ./artifacts/native-aot-release/${{ matrix.rid }}/packages/*.nupkg
          if-no-files-found: error

      - name: Extract version from tag
        if: startsWith(matrix.rid, 'win-')
        id: version
        shell: pwsh
        run: |
          $fullVersion = "${{ github.ref_name }}" -replace '^v', ''
          echo "full_version=$fullVersion" >> $env:GITHUB_OUTPUT
          $msiVersion = $fullVersion -replace '-.*$', ''
          echo "msi_version=$msiVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Full version: $fullVersion, MSI version: $msiVersion"

      - name: Install WiX Toolset
        if: startsWith(matrix.rid, 'win-')
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build dotsider MSI
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          wix build wix\dotsider.wxs `
            -d SourceDir=..\artifacts\native-aot-release\${{ matrix.rid }}\publish\dotsider `
            -d Version=${{ steps.version.outputs.msi_version }} `
            -arch ${{ matrix.arch }} `
            -out artifacts\native-aot-release\${{ matrix.rid }}\publish\${{ matrix.artifact }}.msi

      - name: Build dotsider-mcp MSI
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          wix build wix\dotsider-mcp.wxs `
            -d SourceDir=..\artifacts\native-aot-release\${{ matrix.rid }}\publish\dotsider-mcp `
            -d Version=${{ steps.version.outputs.msi_version }} `
            -arch ${{ matrix.arch }} `
            -out artifacts\native-aot-release\${{ matrix.rid }}\publish\dotsider-mcp-${{ matrix.rid }}.msi

      - name: Verify dotsider MSI installs correctly
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $releaseRoot = "artifacts\native-aot-release\${{ matrix.rid }}\publish"
          $logFile = Join-Path $releaseRoot "msi-install.log"
          $installer = Join-Path $releaseRoot "${{ matrix.artifact }}.msi"
          $proc = Start-Process msiexec.exe -ArgumentList "/i", $installer, "/qn", "/l*v", $logFile -Wait -NoNewWindow -PassThru

          if ($proc.ExitCode -ne 0) {
            Write-Error "MSI installation failed with exit code: $($proc.ExitCode)"
            if (Test-Path $logFile) {
              Get-Content $logFile | Select-Object -Last 50
            }
            exit 1
          }

          $exePath = "${env:ProgramFiles}\dotsider\dotsider.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "dotsider.exe not found at $exePath"
            exit 1
          }

          & $exePath --version
          Write-Host "dotsider MSI verification passed"

          Start-Process msiexec.exe -ArgumentList "/x", $installer, "/qn" -Wait -NoNewWindow

      - name: Verify dotsider-mcp MSI installs correctly
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $releaseRoot = "artifacts\native-aot-release\${{ matrix.rid }}\publish"
          $logFile = Join-Path $releaseRoot "mcp-msi-install.log"
          $installer = Join-Path $releaseRoot "dotsider-mcp-win-x64.msi"
          $proc = Start-Process msiexec.exe -ArgumentList "/i", $installer, "/qn", "/l*v", $logFile -Wait -NoNewWindow -PassThru

          if ($proc.ExitCode -ne 0) {
            Write-Error "dotsider-mcp MSI installation failed with exit code: $($proc.ExitCode)"
            if (Test-Path $logFile) {
              Get-Content $logFile | Select-Object -Last 50
            }
            exit 1
          }

          $exePath = "${env:ProgramFiles}\dotsider-mcp\dotsider-mcp.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "dotsider-mcp.exe not found at $exePath"
            exit 1
          }

          & $exePath --version
          Write-Host "dotsider-mcp MSI verification passed"

          Start-Process msiexec.exe -ArgumentList "/x", $installer, "/qn" -Wait -NoNewWindow

      - name: Upload dotsider MSI artifact
        if: startsWith(matrix.rid, 'win-')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-msi
          path: ./artifacts/native-aot-release/${{ matrix.rid }}/publish/${{ matrix.artifact }}.msi

      - name: Upload dotsider-mcp MSI artifact
        if: startsWith(matrix.rid, 'win-')
        uses: actions/upload-artifact@v7
        with:
          name: dotsider-mcp-${{ matrix.rid }}-msi
          path: ./artifacts/native-aot-release/${{ matrix.rid }}/publish/dotsider-mcp-${{ matrix.rid }}.msi

  build-ci-integrations:
    name: Build CI integrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: integrations/size-check/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Restore integration dependencies
        run: |
          pnpm --dir integrations/size-check install --frozen-lockfile
          pnpm --dir azure-devops install --frozen-lockfile
          pnpm --dir integrations/size-check audit --audit-level low
          pnpm --dir azure-devops audit --audit-level low

      - name: Build and validate integration runtime
        run: |
          pnpm --dir integrations/size-check build
          pnpm --dir integrations/size-check validate
          pnpm --dir integrations/size-check test:unit
          git diff --exit-code -- integrations/size-check/dist azure-devops/tasks/DotsiderSizeCheckV1/runtime

      - name: Package versioned Azure DevOps extension
        if: "!contains(github.ref_name, '-')"
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v') -replace '-.*$', ''
          $versionParts = $version.Split('.')
          if ($versionParts.Count -ne 3) { throw "Expected a three-part release version, got '$version'." }
          $taskPath = 'azure-devops/tasks/DotsiderSizeCheckV1/task.json'
          $task = Get-Content -LiteralPath $taskPath -Raw | ConvertFrom-Json -Depth 100
          $task.version.Major = 1
          $task.version.Minor = [int]$versionParts[0]
          $task.version.Patch = ([int]$versionParts[1] * 1000) + [int]$versionParts[2]
          [System.IO.File]::WriteAllText(
            (Resolve-Path -LiteralPath $taskPath),
            ($task | ConvertTo-Json -Depth 100) + "`n",
            [System.Text.UTF8Encoding]::new($false))
          $override = "{`"version`":`"$version`"}"
          Push-Location azure-devops
          try {
            pnpm exec tfx extension create --manifest-globs vss-extension.json --output-path ../artifacts/azure-devops --rev-version false --override $override --no-color
            if ($LASTEXITCODE -ne 0) { throw 'Failed to package the Azure DevOps extension.' }
          }
          finally {
            Pop-Location
          }
          $source = Get-ChildItem artifacts/azure-devops -Filter '*.vsix' | Select-Object -First 1
          if (-not $source) { throw 'The Azure DevOps VSIX was not produced.' }
          $destination = Join-Path $source.DirectoryName "dotsider-${{ github.ref_name }}-azure-devops.vsix"
          Move-Item -LiteralPath $source.FullName -Destination $destination
          $digest = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $(Split-Path -Leaf $destination)" | Set-Content -LiteralPath "$destination.sha256" -Encoding ascii

      - name: Validate Azure DevOps extension
        if: "!contains(github.ref_name, '-')"
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v') -replace '-.*$', ''
          dotnet run --file ./scripts/Validate-CiIntegrations.cs -- -Vsix artifacts/azure-devops/dotsider-${{ github.ref_name }}-azure-devops.vsix -Version $version

      - name: Attest Azure DevOps extension
        if: "!contains(github.ref_name, '-')"
        uses: actions/attest@v4.2.2
        with:
          subject-path: artifacts/azure-devops/dotsider-${{ github.ref_name }}-azure-devops.vsix

      - name: Upload Azure DevOps extension
        if: "!contains(github.ref_name, '-')"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dotsider-azure-devops-extension
          path: |
            artifacts/azure-devops/*.vsix
            artifacts/azure-devops/*.vsix.sha256
          if-no-files-found: error

  create-release:
    needs: [publish-nuget, build-binaries, build-portable-packages, build-ci-integrations]
    runs-on: ubuntu-latest
    outputs:
      sha256_linux_x64: ${{ steps.checksums.outputs.sha256_linux_x64 }}
      sha256_linux_arm64: ${{ steps.checksums.outputs.sha256_linux_arm64 }}
      sha256_osx_x64: ${{ steps.checksums.outputs.sha256_osx_x64 }}
      sha256_osx_arm64: ${{ steps.checksums.outputs.sha256_osx_arm64 }}
      sha256_win_x64: ${{ steps.checksums.outputs.sha256_win_x64 }}
      sha256_win_arm64: ${{ steps.checksums.outputs.sha256_win_arm64 }}
      sha256_win_msi: ${{ steps.checksums.outputs.sha256_win_msi }}
      sha256_win_arm64_msi: ${{ steps.checksums.outputs.sha256_win_arm64_msi }}
      sha256_mcp_linux_x64: ${{ steps.checksums.outputs.sha256_mcp_linux_x64 }}
      sha256_mcp_linux_arm64: ${{ steps.checksums.outputs.sha256_mcp_linux_arm64 }}
      sha256_mcp_osx_x64: ${{ steps.checksums.outputs.sha256_mcp_osx_x64 }}
      sha256_mcp_osx_arm64: ${{ steps.checksums.outputs.sha256_mcp_osx_arm64 }}
      sha256_mcp_win_x64: ${{ steps.checksums.outputs.sha256_mcp_win_x64 }}
      sha256_mcp_win_arm64: ${{ steps.checksums.outputs.sha256_mcp_win_arm64 }}
      sha256_mcp_win_msi: ${{ steps.checksums.outputs.sha256_mcp_win_msi }}
      sha256_mcp_win_arm64_msi: ${{ steps.checksums.outputs.sha256_mcp_win_arm64_msi }}
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Package binaries
        run: |
          cd artifacts
          shopt -s nullglob

          for product in dotsider dotsider-mcp; do
            executable="$product"
            for rid in win-x64 win-arm64 linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64 osx-x64 osx-arm64; do
              payload="$product-$rid"
              symbols="$product-$rid-symbols"
              if [[ "$rid" == win-* ]]; then
                (cd "$payload" && zip -r "../$payload.zip" .)
                (cd "$symbols" && zip -r "../$symbols.zip" .)
              else
                chmod +x "$payload/$executable"
                tar -czf "$payload.tar.gz" -C "$payload" .
                tar -czf "$symbols.tar.gz" -C "$symbols" .
              fi
            done
          done

          cp dotsider-win-x64-msi/dotsider-win-x64.msi .
          cp dotsider-win-arm64-msi/dotsider-win-arm64.msi .
          cp dotsider-mcp-win-x64-msi/dotsider-mcp-win-x64.msi .
          cp dotsider-mcp-win-arm64-msi/dotsider-mcp-win-arm64.msi .
          vsix=(dotsider-azure-devops-extension/*.vsix)
          vsix_checksums=(dotsider-azure-devops-extension/*.vsix.sha256)
          if (( ${#vsix[@]} != 1 || ${#vsix_checksums[@]} != 1 )); then
            echo "::error::Expected one Azure DevOps VSIX and checksum in the downloaded integration artifact."
            exit 1
          fi
          cp "${vsix[@]}" "${vsix_checksums[@]}" .

      - name: Calculate SHA256 checksums
        id: checksums
        run: |
          cd artifacts

          shopt -s nullglob
          for file in ./*.zip ./*.tar.gz ./*.msi; do
            sha256sum "$file" > "$file.sha256"
          done

          {
            echo "sha256_linux_x64=$(cut -d' ' -f1 dotsider-linux-x64.tar.gz.sha256)"
            echo "sha256_linux_arm64=$(cut -d' ' -f1 dotsider-linux-arm64.tar.gz.sha256)"
            echo "sha256_osx_x64=$(cut -d' ' -f1 dotsider-osx-x64.tar.gz.sha256)"
            echo "sha256_osx_arm64=$(cut -d' ' -f1 dotsider-osx-arm64.tar.gz.sha256)"
            echo "sha256_win_x64=$(cut -d' ' -f1 dotsider-win-x64.zip.sha256)"
            echo "sha256_win_arm64=$(cut -d' ' -f1 dotsider-win-arm64.zip.sha256)"
            echo "sha256_win_msi=$(cut -d' ' -f1 dotsider-win-x64.msi.sha256)"
            echo "sha256_win_arm64_msi=$(cut -d' ' -f1 dotsider-win-arm64.msi.sha256)"
            echo "sha256_mcp_linux_x64=$(cut -d' ' -f1 dotsider-mcp-linux-x64.tar.gz.sha256)"
            echo "sha256_mcp_linux_arm64=$(cut -d' ' -f1 dotsider-mcp-linux-arm64.tar.gz.sha256)"
            echo "sha256_mcp_osx_x64=$(cut -d' ' -f1 dotsider-mcp-osx-x64.tar.gz.sha256)"
            echo "sha256_mcp_osx_arm64=$(cut -d' ' -f1 dotsider-mcp-osx-arm64.tar.gz.sha256)"
            echo "sha256_mcp_win_x64=$(cut -d' ' -f1 dotsider-mcp-win-x64.zip.sha256)"
            echo "sha256_mcp_win_arm64=$(cut -d' ' -f1 dotsider-mcp-win-arm64.zip.sha256)"
            echo "sha256_mcp_win_msi=$(cut -d' ' -f1 dotsider-mcp-win-x64.msi.sha256)"
            echo "sha256_mcp_win_arm64_msi=$(cut -d' ' -f1 dotsider-mcp-win-arm64.msi.sha256)"
          } >> "$GITHUB_OUTPUT"

          cat ./*.sha256

      - name: Attest released archives and installers
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.msi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          TAG="${GITHUB_REF#refs/tags/}"
          RELEASE_FLAGS=()
          if [[ "$TAG" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease)
            PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          else
            RELEASE_FLAGS=(--latest)
            PREV_TAG=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          fi
          NOTES_FLAGS=(--generate-notes)
          if [ -n "$PREV_TAG" ]; then
            NOTES_FLAGS=(--generate-notes --notes-start-tag "$PREV_TAG")
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            "${NOTES_FLAGS[@]}" \
            "${RELEASE_FLAGS[@]}" \
            artifacts/*.zip \
            artifacts/*.tar.gz \
            artifacts/*.msi \
            artifacts/*.vsix \
            artifacts/*.sha256

  verify-size-check-release:
    name: Verify size-check release (${{ matrix.rid }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-26-intel
          - rid: osx-arm64
            os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Publish real Native AOT comparison pair
        id: comparison-assets
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'dotsider-size-check-release'
          $baselineDirectory = Join-Path $root 'baseline'
          $targetDirectory = Join-Path $root 'target'
          dotnet publish samples/NativeAotConsole/NativeAotConsole.csproj -c Release -r '${{ matrix.rid }}' --output $baselineDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish samples/NativeAotConsoleV2/NativeAotConsoleV2.csproj -c Release -r '${{ matrix.rid }}' --output $targetDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $baseline = Join-Path $baselineDirectory "NativeAotConsole$suffix"
          $target = Join-Path $targetDirectory "NativeAotConsole$suffix"
          foreach ($required in @($baseline, $target, (Join-Path $targetDirectory 'NativeAotConsole.mstat'))) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing real release test asset: $required" }
          }
          "DOTSIDER_RELEASE_BASELINE=$baseline" >> $env:GITHUB_ENV
          "DOTSIDER_RELEASE_TARGET=$target" >> $env:GITHUB_ENV
          "baseline=$baseline" >> $env:GITHUB_OUTPUT
          "target=$target" >> $env:GITHUB_OUTPUT

      - name: Acquire released Dotsider and run size check
        id: released
        uses: ./
        with:
          target: ${{ steps.comparison-assets.outputs.target }}
          baseline: ${{ steps.comparison-assets.outputs.baseline }}
          dotsider-version: ${{ github.ref_name }}
          artifact-name: dotsider-size-check-release-${{ matrix.rid }}

      - name: Assert released action outputs
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ('${{ steps.released.outputs.result }}' -ne 'passed') { throw 'Released action did not pass.' }
          if ('${{ steps.released.outputs.exit-code }}' -ne '0') { throw 'Released action returned a nonzero exit code.' }
          if ('${{ steps.released.outputs.dotsider-version }}' -ne $version) { throw 'Released action resolved the wrong version.' }
          $report = Get-Content -LiteralPath '${{ steps.released.outputs.json-report-path }}' -Raw | ConvertFrom-Json
          if ($report.schemaVersion -ne 1) { throw 'Released action returned an unsupported report schema.' }

      - name: Reuse the resolved Dotsider tool
        uses: ./
        with:
          target: ${{ steps.comparison-assets.outputs.target }}
          baseline: ${{ steps.comparison-assets.outputs.baseline }}
          dotsider-version: ${{ github.ref_name }}
          report-directory: ${{ runner.temp }}/dotsider-size-check-cache-reuse
          upload-reports: 'false'

  publish-azure-devops-marketplace:
    name: Publish Azure DevOps extension
    if: "!contains(github.ref_name, '-')"
    needs: [verify-size-check-release, build-ci-integrations]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: azure-devops/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Install Azure DevOps publishing dependencies
        run: pnpm --dir azure-devops install --frozen-lockfile

      - name: Download release extension
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetName = "dotsider-${{ github.ref_name }}-azure-devops.vsix"
          $directory = Join-Path $env:RUNNER_TEMP 'dotsider-marketplace-release'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          gh release download '${{ github.ref_name }}' --repo $env:GITHUB_REPOSITORY --pattern $assetName --pattern "$assetName.sha256" --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Azure DevOps extension download failed.' }
          "DOTSIDER_VSIX_PATH=$(Join-Path $directory $assetName)" >> $env:GITHUB_ENV
          "DOTSIDER_VSIX_CHECKSUM_PATH=$(Join-Path $directory "$assetName.sha256")" >> $env:GITHUB_ENV

      - name: Verify extension checksum, package, and attestation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $expected = (Get-Content -LiteralPath $env:DOTSIDER_VSIX_CHECKSUM_PATH -Raw).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $env:DOTSIDER_VSIX_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "VSIX checksum mismatch: expected $expected, received $actual." }
          dotnet run --file ./scripts/Validate-CiIntegrations.cs -- -Vsix $env:DOTSIDER_VSIX_PATH -Version '${{ github.ref_name }}'.TrimStart('v')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh attestation verify $env:DOTSIDER_VSIX_PATH --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'VSIX attestation verification failed.' }

      - name: Publish extension idempotently
        shell: pwsh
        env:
          AZURE_DEVOPS_MARKETPLACE_PAT: ${{ secrets.AZURE_DEVOPS_MARKETPLACE_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_DEVOPS_MARKETPLACE_PAT)) {
            throw 'AZURE_DEVOPS_MARKETPLACE_PAT is required.'
          }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          Push-Location azure-devops
          try {
            $extensionJson = pnpm exec tfx extension show --publisher willibrandon --extension-id dotsider --token $env:AZURE_DEVOPS_MARKETPLACE_PAT --json --no-prompt --no-color 2>$null
            $published = $false
            if ($LASTEXITCODE -eq 0) {
              $extension = $extensionJson | ConvertFrom-Json -Depth 100
              $published = @($extension.versions | ForEach-Object { $_.version }) -contains $version
            }
            if (-not $published) {
              pnpm exec tfx extension publish --vsix $env:DOTSIDER_VSIX_PATH --token $env:AZURE_DEVOPS_MARKETPLACE_PAT --no-prompt --no-color
              if ($LASTEXITCODE -ne 0) { throw 'Azure DevOps Marketplace publication failed.' }
            } else {
              Write-Host "Azure DevOps extension $version is already published."
            }

            $verifiedJson = pnpm exec tfx extension show --publisher willibrandon --extension-id dotsider --token $env:AZURE_DEVOPS_MARKETPLACE_PAT --json --no-prompt --no-color
            if ($LASTEXITCODE -ne 0) { throw 'Published Azure DevOps extension could not be queried.' }
            $verified = $verifiedJson | ConvertFrom-Json -Depth 100
            if (@($verified.versions | ForEach-Object { $_.version }) -notcontains $version) {
              throw "Azure DevOps Marketplace does not list extension version $version."
            }
          }
          finally {
            Pop-Location
          }

  publish-github-action:
    name: Advance GitHub Action release channel
    if: "!contains(github.ref_name, '-')"
    needs: publish-azure-devops-marketplace
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Advance GitHub Action major tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = '${{ github.ref_name }}'
          if ($releaseTag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Expected a stable canonical release tag; received '$releaseTag'."
          }
          $majorTag = "v$($Matches[1])"
          $releaseCommit = (git rev-parse "$releaseTag^{commit}").Trim()
          $referencePath = "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$majorTag"
          $existing = gh api $referencePath --jq '.object.sha' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$majorTag" -f sha=$releaseCommit >$null
          } elseif ($existing -ne $releaseCommit) {
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$majorTag" -f sha=$releaseCommit -F force=true >$null
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not advance $majorTag to $releaseCommit." }
          "GitHub Action tag ``$majorTag`` now targets ``$releaseCommit``." >> $env:GITHUB_STEP_SUMMARY

  verify-github-marketplace:
    name: Verify GitHub Marketplace listing
    if: "!contains(github.ref_name, '-')"
    needs: publish-github-action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify released action listing
        shell: pwsh
        run: |
          $marketplaceUrl = 'https://github.com/marketplace/actions/dotsider-size-check'
          $repositoryLink = "href=`"/$env:GITHUB_REPOSITORY`""
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            $response = Invoke-WebRequest -Uri $marketplaceUrl -MaximumRedirection 3 -SkipHttpErrorCheck
            if ($response.StatusCode -eq 200 -and
                $response.Content.Contains($repositoryLink, [StringComparison]::OrdinalIgnoreCase) -and
                $response.Content.Contains('${{ github.ref_name }}', [StringComparison]::Ordinal)) {
              exit 0
            }
            if ($attempt -lt 12) { Start-Sleep -Seconds 10 }
          }
          throw "GitHub Marketplace does not list $env:GITHUB_REPOSITORY at ${{ github.ref_name }}."

  update-homebrew:
    needs: create-release
    if: "!contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Clone homebrew-tap repository
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/willibrandon/homebrew-tap.git
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update formulas with new version and checksums
        run: |
          cd homebrew-tap
          VERSION="${{ steps.version.outputs.version }}"

          # Update dotsider formula
          sed -i "s/version \".*\"/version \"$VERSION\"/" Formula/dotsider.rb

          python3 << 'EOF'
          import re

          # Update dotsider checksums
          with open('Formula/dotsider.rb', 'r') as f:
              content = f.read()

          shas = {
              'osx-x64': '${{ needs.create-release.outputs.sha256_osx_x64 }}',
              'osx-arm64': '${{ needs.create-release.outputs.sha256_osx_arm64 }}',
              'linux-arm64': '${{ needs.create-release.outputs.sha256_linux_arm64 }}',
              'linux-x64': '${{ needs.create-release.outputs.sha256_linux_x64 }}',
          }

          for platform, sha in shas.items():
              pattern = rf'(url "https://github\.com/willibrandon/dotsider/releases/download/v#\{{version\}}/dotsider-{platform}\.tar\.gz"\s+sha256 ")[^"]*(")'
              content = re.sub(pattern, rf'\g<1>{sha}\2', content)

          with open('Formula/dotsider.rb', 'w') as f:
              f.write(content)

          # Update dotsider-mcp checksums
          with open('Formula/dotsider-mcp.rb', 'r') as f:
              content = f.read()

          shas_mcp = {
              'osx-x64': '${{ needs.create-release.outputs.sha256_mcp_osx_x64 }}',
              'osx-arm64': '${{ needs.create-release.outputs.sha256_mcp_osx_arm64 }}',
              'linux-arm64': '${{ needs.create-release.outputs.sha256_mcp_linux_arm64 }}',
              'linux-x64': '${{ needs.create-release.outputs.sha256_mcp_linux_x64 }}',
          }

          for platform, sha in shas_mcp.items():
              pattern = rf'(url "https://github\.com/willibrandon/dotsider/releases/download/v#\{{version\}}/dotsider-mcp-{platform}\.tar\.gz"\s+sha256 ")[^"]*(")'
              content = re.sub(pattern, rf'\g<1>{sha}\2', content)

          with open('Formula/dotsider-mcp.rb', 'w') as f:
              f.write(content)
          EOF

          # Update dotsider-mcp formula version
          sed -i "s/version \".*\"/version \"$VERSION\"/" Formula/dotsider-mcp.rb

          echo "Updated Formula/dotsider.rb:"
          cat Formula/dotsider.rb
          echo ""
          echo "Updated Formula/dotsider-mcp.rb:"
          cat Formula/dotsider-mcp.rb

      - name: Commit and push changes
        run: |
          cd homebrew-tap
          VERSION="${{ steps.version.outputs.version }}"

          git add Formula/dotsider.rb Formula/dotsider-mcp.rb
          git diff --staged --quiet || git commit -m "Update dotsider and dotsider-mcp to $VERSION"
          git push origin main

  update-scoop:
    needs: create-release
    if: "!contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Clone scoop-bucket repository
        run: |
          git clone https://x-access-token:${{ secrets.SCOOP_BUCKET_TOKEN }}@github.com/willibrandon/scoop-bucket.git
          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update manifests with new version and checksums
        run: |
          cd scoop-bucket

          python3 << 'EOF'
          import json

          version = "${{ steps.version.outputs.version }}"

          # Update dotsider manifest
          sha_win_x64 = "${{ needs.create-release.outputs.sha256_win_x64 }}"
          sha_win_arm64 = "${{ needs.create-release.outputs.sha256_win_arm64 }}"

          with open('bucket/dotsider.json', 'r') as f:
              manifest = json.load(f)

          manifest['version'] = version
          manifest['architecture']['64bit']['url'] = f'https://github.com/willibrandon/dotsider/releases/download/v{version}/dotsider-win-x64.zip'
          manifest['architecture']['64bit']['hash'] = sha_win_x64
          manifest['architecture']['arm64']['url'] = f'https://github.com/willibrandon/dotsider/releases/download/v{version}/dotsider-win-arm64.zip'
          manifest['architecture']['arm64']['hash'] = sha_win_arm64

          with open('bucket/dotsider.json', 'w') as f:
              json.dump(manifest, f, indent=4)
              f.write('\n')

          # Update dotsider-mcp manifest
          sha_mcp_win_x64 = "${{ needs.create-release.outputs.sha256_mcp_win_x64 }}"
          sha_mcp_win_arm64 = "${{ needs.create-release.outputs.sha256_mcp_win_arm64 }}"

          with open('bucket/dotsider-mcp.json', 'r') as f:
              manifest = json.load(f)

          manifest['version'] = version
          manifest['architecture']['64bit']['url'] = f'https://github.com/willibrandon/dotsider/releases/download/v{version}/dotsider-mcp-win-x64.zip'
          manifest['architecture']['64bit']['hash'] = sha_mcp_win_x64
          manifest['architecture']['arm64']['url'] = f'https://github.com/willibrandon/dotsider/releases/download/v{version}/dotsider-mcp-win-arm64.zip'
          manifest['architecture']['arm64']['hash'] = sha_mcp_win_arm64

          with open('bucket/dotsider-mcp.json', 'w') as f:
              json.dump(manifest, f, indent=4)
              f.write('\n')
          EOF

          echo "Updated bucket/dotsider.json:"
          cat bucket/dotsider.json
          echo ""
          echo "Updated bucket/dotsider-mcp.json:"
          cat bucket/dotsider-mcp.json

      - name: Commit and push changes
        run: |
          cd scoop-bucket
          VERSION="${{ steps.version.outputs.version }}"

          git add bucket/dotsider.json bucket/dotsider-mcp.json
          git diff --staged --quiet || git commit -m "Update dotsider and dotsider-mcp to $VERSION"
          git push origin main

  update-winget:
    needs: create-release
    if: "!contains(github.ref_name, '-')"
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check if dotsider package exists in winget-pkgs
        id: check
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/w/willibrandon/dotsider" -Method Head -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Check if dotsider-mcp package exists in winget-pkgs
        id: check_mcp
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/w/willibrandon/dotsider-mcp" -Method Head -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      # --- dotsider winget submission ---

      - name: Generate dotsider winget manifest (update existing)
        if: steps.check.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $urlX64 = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-win-x64.msi"
          $urlArm64 = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-win-arm64.msi"

          .\wingetcreate.exe update willibrandon.dotsider `
            --version $version `
            --urls $urlX64 $urlArm64 `
            --token $env:GH_TOKEN `
            --out manifests

      - name: Generate dotsider winget manifest (new package)
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          # Use checked-in manifest templates
          $manifestDir = "manifests/w/willibrandon/dotsider/$version"
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          Copy-Item winget/willibrandon.dotsider.yaml $manifestDir/
          Copy-Item winget/willibrandon.dotsider.installer.yaml $manifestDir/
          Copy-Item winget/willibrandon.dotsider.locale.en-US.yaml $manifestDir/

          # Update version and URL in copied manifests
          Get-ChildItem $manifestDir -Filter *.yaml | ForEach-Object {
            (Get-Content $_.FullName) -replace '0\.3\.0', $version | Set-Content $_.FullName
          }
          $installerYaml = "$manifestDir/willibrandon.dotsider.installer.yaml"
          (Get-Content $installerYaml) -replace 'v0\.3\.0', "v$version" | Set-Content $installerYaml

          # Process both architectures
          $archs = @(
            @{ Rid = 'x64'; ShaSuffix = 'X64'; PcSuffix = 'X64' },
            @{ Rid = 'arm64'; ShaSuffix = 'ARM64'; PcSuffix = 'ARM64' }
          )
          foreach ($arch in $archs) {
            $url = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-win-$($arch.Rid).msi"
            $msiFile = New-TemporaryFile
            Invoke-WebRequest -Uri $url -OutFile $msiFile.FullName

            $sha256 = (Get-FileHash $msiFile.FullName -Algorithm SHA256).Hash
            (Get-Content $installerYaml) -replace "PLACEHOLDER_SHA256_$($arch.ShaSuffix)", $sha256 | Set-Content $installerYaml

            $pattern = 'ProductCode(\{[0-9a-fA-F-]{36}\})'
            $stream = [System.IO.File]::OpenRead($msiFile.FullName)
            $reader = [System.IO.StreamReader]::New($stream, [System.Text.Encoding]::ASCII)
            $productCode = $null
            while ($null -ne ($line = $reader.ReadLine())) {
              if ($line -match $pattern) {
                $productCode = $Matches[1]
                break
              }
            }
            $reader.Close()
            $stream.Close()
            Remove-Item $msiFile.FullName

            if ($productCode) {
              (Get-Content $installerYaml) -replace "\{PLACEHOLDER_PRODUCT_CODE_$($arch.PcSuffix)\}", $productCode | Set-Content $installerYaml
            }
          }

          Write-Host "Generated dotsider manifests:"
          Get-ChildItem $manifestDir | ForEach-Object { Write-Host $_.Name }

      # --- dotsider-mcp winget submission ---

      - name: Generate dotsider-mcp winget manifest (update existing)
        if: steps.check_mcp.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $urlX64 = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-mcp-win-x64.msi"
          $urlArm64 = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-mcp-win-arm64.msi"

          .\wingetcreate.exe update willibrandon.dotsider-mcp `
            --version $version `
            --urls $urlX64 $urlArm64 `
            --token $env:GH_TOKEN `
            --out manifests-mcp

      - name: Generate dotsider-mcp winget manifest (new package)
        if: steps.check_mcp.outputs.exists == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          # Use checked-in manifest templates
          $manifestDir = "manifests-mcp/w/willibrandon/dotsider-mcp/$version"
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          Copy-Item winget/willibrandon.dotsider-mcp.yaml $manifestDir/
          Copy-Item winget/willibrandon.dotsider-mcp.installer.yaml $manifestDir/
          Copy-Item winget/willibrandon.dotsider-mcp.locale.en-US.yaml $manifestDir/

          # Update version and URL in copied manifests
          Get-ChildItem $manifestDir -Filter *.yaml | ForEach-Object {
            (Get-Content $_.FullName) -replace '0\.3\.0', $version | Set-Content $_.FullName
          }
          $installerYaml = "$manifestDir/willibrandon.dotsider-mcp.installer.yaml"
          (Get-Content $installerYaml) -replace 'v0\.3\.0', "v$version" | Set-Content $installerYaml

          # Process both architectures
          $archs = @(
            @{ Rid = 'x64'; ShaSuffix = 'X64'; PcSuffix = 'X64' },
            @{ Rid = 'arm64'; ShaSuffix = 'ARM64'; PcSuffix = 'ARM64' }
          )
          foreach ($arch in $archs) {
            $url = "https://github.com/willibrandon/dotsider/releases/download/v$version/dotsider-mcp-win-$($arch.Rid).msi"
            $msiFile = New-TemporaryFile
            Invoke-WebRequest -Uri $url -OutFile $msiFile.FullName

            $sha256 = (Get-FileHash $msiFile.FullName -Algorithm SHA256).Hash
            (Get-Content $installerYaml) -replace "PLACEHOLDER_SHA256_$($arch.ShaSuffix)", $sha256 | Set-Content $installerYaml

            $pattern = 'ProductCode(\{[0-9a-fA-F-]{36}\})'
            $stream = [System.IO.File]::OpenRead($msiFile.FullName)
            $reader = [System.IO.StreamReader]::New($stream, [System.Text.Encoding]::ASCII)
            $productCode = $null
            while ($null -ne ($line = $reader.ReadLine())) {
              if ($line -match $pattern) {
                $productCode = $Matches[1]
                break
              }
            }
            $reader.Close()
            $stream.Close()
            Remove-Item $msiFile.FullName

            if ($productCode) {
              (Get-Content $installerYaml) -replace "\{PLACEHOLDER_PRODUCT_CODE_$($arch.PcSuffix)\}", $productCode | Set-Content $installerYaml
            }
          }

          Write-Host "Generated dotsider-mcp manifests:"
          Get-ChildItem $manifestDir | ForEach-Object { Write-Host $_.Name }

      - name: Submit dotsider winget PR via GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $branch = "dotsider-$version"
          $manifestDir = "manifests/w/willibrandon/dotsider/$version"

          function Upsert-WingetBranch {
            param(
              [Parameter(Mandatory=$true)][string]$Branch,
              [Parameter(Mandatory=$true)][string]$Sha
            )

            $refPath = "heads/$Branch"
            $updated = $false
            for ($attempt = 1; $attempt -le 3 -and -not $updated; $attempt++) {
              gh api "repos/willibrandon/winget-pkgs/git/ref/$refPath" --silent 2>$null
              if ($LASTEXITCODE -eq 0) {
                gh api "repos/willibrandon/winget-pkgs/git/refs/$refPath" -X PATCH -f sha="$Sha" -F force=true --silent
              } else {
                gh api repos/willibrandon/winget-pkgs/git/refs -X POST -f ref="refs/$refPath" -f sha="$Sha" --silent
              }

              $updated = $LASTEXITCODE -eq 0
              if (-not $updated -and $attempt -lt 3) {
                Write-Host "Winget branch upsert failed on attempt $attempt; retrying..."
                Start-Sleep -Seconds 2
              }
            }

            if (-not $updated) {
              throw "Failed to create or update winget branch $Branch"
            }

            $resolvedSha = $null
            $resolvedExitCode = 1
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              $resolvedSha = $null
              $resolvedSha = gh api "repos/willibrandon/winget-pkgs/git/ref/$refPath" --jq '.object.sha' 2>$null
              $resolvedExitCode = $LASTEXITCODE
              if ($resolvedExitCode -eq 0 -and $resolvedSha -eq $Sha) {
                break
              }

              if ($attempt -lt 5) {
                Write-Host "Winget branch $Branch has not resolved to $Sha yet; retrying..."
                Start-Sleep -Seconds 2
              }
            }

            if ($resolvedExitCode -ne 0 -or $resolvedSha -ne $Sha) {
              throw "Winget branch $Branch points to $resolvedSha, expected $Sha"
            }

            Write-Host "Branch $Branch updated to $Sha"
          }

          function New-WingetPullRequest {
            param(
              [Parameter(Mandatory=$true)][string]$Branch,
              [Parameter(Mandatory=$true)][string]$Title,
              [Parameter(Mandatory=$true)][string]$Body
            )

            $existingJson = gh api "repos/microsoft/winget-pkgs/pulls?state=open&head=willibrandon:$Branch&base=master" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $existing = $existingJson | ConvertFrom-Json | Select-Object -First 1
              if ($existing) {
                Write-Host "Winget PR already exists: $($existing.html_url)"
                return
              }
            }

            @{
              title = $Title
              head = "willibrandon:$Branch"
              base = "master"
              body = $Body
              maintainer_can_modify = $true
            } | ConvertTo-Json -Compress | Out-File -FilePath winget-pr.json -Encoding utf8NoBOM

            $prUrl = gh api repos/microsoft/winget-pkgs/pulls -X POST --input winget-pr.json --jq '.html_url'
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create winget PR for $Branch"
            }

            Write-Host "Created winget PR: $prUrl"
          }

          Write-Host "Syncing fork with upstream..."
          gh api repos/willibrandon/winget-pkgs/merge-upstream -X POST -f branch="master"

          $forkRef = gh api repos/willibrandon/winget-pkgs/git/ref/heads/master --jq '.object.sha'
          Write-Host "Fork master SHA: $forkRef"

          $baseTreeSha = gh api "repos/willibrandon/winget-pkgs/git/commits/$forkRef" --jq '.tree.sha'
          Write-Host "Base tree SHA: $baseTreeSha"

          $treeEntries = [System.Collections.ArrayList]@()
          Get-ChildItem -Path "manifests" -Recurse -File | ForEach-Object {
            $content = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($_.FullName))
            $blobResponse = gh api repos/willibrandon/winget-pkgs/git/blobs -X POST -f content="$content" -f encoding="base64"
            $blobSha = $blobResponse | ConvertFrom-Json | Select-Object -ExpandProperty sha
            $path = "$manifestDir/$($_.Name)"
            Write-Host "Created blob for $path : $blobSha"
            [void]$treeEntries.Add(@{path=$path; mode="100644"; type="blob"; sha=$blobSha})
          }

          $treeData = @{base_tree=$baseTreeSha; tree=$treeEntries.ToArray()}
          $treeJson = $treeData | ConvertTo-Json -Depth 10
          Write-Host "Tree JSON: $treeJson"
          $treeJson | Out-File -FilePath tree.json -Encoding utf8NoBOM
          $newTree = gh api repos/willibrandon/winget-pkgs/git/trees -X POST --input tree.json
          $newTreeSha = $newTree | ConvertFrom-Json | Select-Object -ExpandProperty sha
          Write-Host "New tree SHA: $newTreeSha"
          if ($newTreeSha -eq $baseTreeSha) {
            Write-Host "No dotsider winget manifest changes to submit."
            exit 0
          }

          $commitJson = @{
            message="Update willibrandon.dotsider to $version [skip actions]"
            tree=$newTreeSha
            parents=@($forkRef)
          } | ConvertTo-Json -Compress
          $commitJson | Out-File -FilePath commit.json -Encoding utf8
          $newCommit = gh api repos/willibrandon/winget-pkgs/git/commits -X POST --input commit.json
          $newCommitSha = $newCommit | ConvertFrom-Json | Select-Object -ExpandProperty sha
          Write-Host "New commit SHA: $newCommitSha"

          Upsert-WingetBranch -Branch $branch -Sha $newCommitSha

          $exists = "${{ steps.check.outputs.exists }}"
          if ($exists -eq "true") {
            $prTitle = "Update willibrandon.dotsider to $version"
            $prBody = "## Description`n`nUpdate dotsider to version $version`n`n## Release notes`n`nhttps://github.com/willibrandon/dotsider/releases/tag/v$version"
          } else {
            $prTitle = "New package: willibrandon.dotsider $version"
            $prBody = "## Description`n`nAdd dotsider version $version`n`n## Release notes`n`nhttps://github.com/willibrandon/dotsider/releases/tag/v$version"
          }

          New-WingetPullRequest -Branch $branch -Title $prTitle -Body $prBody

      - name: Submit dotsider-mcp winget PR via GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $branch = "dotsider-mcp-$version"
          $manifestDir = "manifests-mcp/w/willibrandon/dotsider-mcp/$version"

          function Upsert-WingetBranch {
            param(
              [Parameter(Mandatory=$true)][string]$Branch,
              [Parameter(Mandatory=$true)][string]$Sha
            )

            $refPath = "heads/$Branch"
            $updated = $false
            for ($attempt = 1; $attempt -le 3 -and -not $updated; $attempt++) {
              gh api "repos/willibrandon/winget-pkgs/git/ref/$refPath" --silent 2>$null
              if ($LASTEXITCODE -eq 0) {
                gh api "repos/willibrandon/winget-pkgs/git/refs/$refPath" -X PATCH -f sha="$Sha" -F force=true --silent
              } else {
                gh api repos/willibrandon/winget-pkgs/git/refs -X POST -f ref="refs/$refPath" -f sha="$Sha" --silent
              }

              $updated = $LASTEXITCODE -eq 0
              if (-not $updated -and $attempt -lt 3) {
                Write-Host "Winget branch upsert failed on attempt $attempt; retrying..."
                Start-Sleep -Seconds 2
              }
            }

            if (-not $updated) {
              throw "Failed to create or update winget branch $Branch"
            }

            $resolvedSha = $null
            $resolvedExitCode = 1
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              $resolvedSha = $null
              $resolvedSha = gh api "repos/willibrandon/winget-pkgs/git/ref/$refPath" --jq '.object.sha' 2>$null
              $resolvedExitCode = $LASTEXITCODE
              if ($resolvedExitCode -eq 0 -and $resolvedSha -eq $Sha) {
                break
              }

              if ($attempt -lt 5) {
                Write-Host "Winget branch $Branch has not resolved to $Sha yet; retrying..."
                Start-Sleep -Seconds 2
              }
            }

            if ($resolvedExitCode -ne 0 -or $resolvedSha -ne $Sha) {
              throw "Winget branch $Branch points to $resolvedSha, expected $Sha"
            }

            Write-Host "Branch $Branch updated to $Sha"
          }

          function New-WingetPullRequest {
            param(
              [Parameter(Mandatory=$true)][string]$Branch,
              [Parameter(Mandatory=$true)][string]$Title,
              [Parameter(Mandatory=$true)][string]$Body
            )

            $existingJson = gh api "repos/microsoft/winget-pkgs/pulls?state=open&head=willibrandon:$Branch&base=master" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $existing = $existingJson | ConvertFrom-Json | Select-Object -First 1
              if ($existing) {
                Write-Host "Winget PR already exists: $($existing.html_url)"
                return
              }
            }

            @{
              title = $Title
              head = "willibrandon:$Branch"
              base = "master"
              body = $Body
              maintainer_can_modify = $true
            } | ConvertTo-Json -Compress | Out-File -FilePath winget-pr-mcp.json -Encoding utf8NoBOM

            $prUrl = gh api repos/microsoft/winget-pkgs/pulls -X POST --input winget-pr-mcp.json --jq '.html_url'
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create winget PR for $Branch"
            }

            Write-Host "Created winget PR: $prUrl"
          }

          $forkRef = gh api repos/willibrandon/winget-pkgs/git/ref/heads/master --jq '.object.sha'
          Write-Host "Fork master SHA: $forkRef"

          $baseTreeSha = gh api "repos/willibrandon/winget-pkgs/git/commits/$forkRef" --jq '.tree.sha'
          Write-Host "Base tree SHA: $baseTreeSha"

          $treeEntries = [System.Collections.ArrayList]@()
          Get-ChildItem -Path "manifests-mcp" -Recurse -File | ForEach-Object {
            $content = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($_.FullName))
            $blobResponse = gh api repos/willibrandon/winget-pkgs/git/blobs -X POST -f content="$content" -f encoding="base64"
            $blobSha = $blobResponse | ConvertFrom-Json | Select-Object -ExpandProperty sha
            $wingetPath = "manifests/w/willibrandon/dotsider-mcp/$version/$($_.Name)"
            Write-Host "Created blob for $wingetPath : $blobSha"
            [void]$treeEntries.Add(@{path=$wingetPath; mode="100644"; type="blob"; sha=$blobSha})
          }

          $treeData = @{base_tree=$baseTreeSha; tree=$treeEntries.ToArray()}
          $treeJson = $treeData | ConvertTo-Json -Depth 10
          Write-Host "Tree JSON: $treeJson"
          $treeJson | Out-File -FilePath tree-mcp.json -Encoding utf8NoBOM
          $newTree = gh api repos/willibrandon/winget-pkgs/git/trees -X POST --input tree-mcp.json
          $newTreeSha = $newTree | ConvertFrom-Json | Select-Object -ExpandProperty sha
          Write-Host "New tree SHA: $newTreeSha"
          if ($newTreeSha -eq $baseTreeSha) {
            Write-Host "No dotsider-mcp winget manifest changes to submit."
            exit 0
          }

          $commitJson = @{
            message="Update willibrandon.dotsider-mcp to $version [skip actions]"
            tree=$newTreeSha
            parents=@($forkRef)
          } | ConvertTo-Json -Compress
          $commitJson | Out-File -FilePath commit-mcp.json -Encoding utf8
          $newCommit = gh api repos/willibrandon/winget-pkgs/git/commits -X POST --input commit-mcp.json
          $newCommitSha = $newCommit | ConvertFrom-Json | Select-Object -ExpandProperty sha
          Write-Host "New commit SHA: $newCommitSha"

          Upsert-WingetBranch -Branch $branch -Sha $newCommitSha

          $exists = "${{ steps.check_mcp.outputs.exists }}"
          if ($exists -eq "true") {
            $prTitle = "Update willibrandon.dotsider-mcp to $version"
            $prBody = "## Description`n`nUpdate dotsider-mcp to version $version`n`n## Release notes`n`nhttps://github.com/willibrandon/dotsider/releases/tag/v$version"
          } else {
            $prTitle = "New package: willibrandon.dotsider-mcp $version"
            $prBody = "## Description`n`nAdd dotsider-mcp version $version`n`n## Release notes`n`nhttps://github.com/willibrandon/dotsider/releases/tag/v$version"
