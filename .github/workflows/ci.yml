name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Scan for secrets
        uses: willibrandon/picket@v0.1.10
        with:
          cache-mode: secret-hash-only
          fail-on: findings
          redact: 100
          timeout: 300

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail

          for project in \
            tests/Dotsider.Tests/Dotsider.Tests.csproj \
            tests/Dotsider.Mcp.Tests/Dotsider.Mcp.Tests.csproj \
            tests/Dotsider.Website.Tests/Dotsider.Website.Tests.csproj
          do
            project_name="$(basename "$(dirname "$project")")"
            result_dir="TestResults/${{ matrix.os }}/${project_name}"
            mkdir -p "$result_dir"
            export DOTSIDER_R2R_DIAGNOSTICS=1
            export DOTSIDER_R2R_DIAGNOSTICS_PATH="$result_dir/r2r-diagnostics.log"
            : > "$DOTSIDER_R2R_DIAGNOSTICS_PATH"
            set +e
            dotnet test "$project" \
              --no-build \
              --report-trx \
              --results-directory "$result_dir" \
              --coverage \
              --coverage-output-format cobertura \
              --diagnostic \
              --diagnostic-verbosity Trace \
              --diagnostic-output-directory "$result_dir" \
              --diagnostic-file-prefix "$project_name" \
              2>&1 | tee "$result_dir/dotnet-test.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          done

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/*.cobertura.xml
            TestResults/**/*.diag
            TestResults/**/*.log

  deploy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run deploy tests
        run: bash tests/deploy/run.sh
