name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/Dotsider.Website/**'
      - 'src/Dotsider.DeployHost/**'
      - 'src/Dotsider/**'
      - 'src/Dotsider.Core/**'
      - 'samples/**'
      - 'deploy/**'
      - 'scripts/Deploy-Website.cs'
      - 'scripts/Deploy/**'
      - 'scripts/ScriptSupport.cs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ── Build docs site ──────────────────────────────────────────
      # pnpm/action-setup goes first so its pinned binary (read from
      # docs/package.json's packageManager field) sits on PATH before
      # setup-node calls `pnpm store path` for cache resolution. Otherwise
      # the runner's system pnpm answers and the store paths diverge.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: docs

      - run: pnpm build
        working-directory: docs

      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/dist/

      # ── Build WebSocket server + sample assembly ─────────────────
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - name: Publish Dotsider.Website
        run: >
          dotnet publish src/Dotsider.Website/Dotsider.Website.csproj
          -c Release
          -r linux-x64
          --self-contained
          -p:PublishSingleFile=true
          -o ./publish/website

      - name: Publish sample assembly
        # Publish (not build) so the .deps.json and every NuGet dependency that
        # RichLibrary resolves at runtime ship together as a unit. Hand-copying
        # just RichLibrary.dll drifts every time the sample's package closure
        # changes — Newtonsoft.Json, any future deps, etc.
        run: >
          dotnet publish samples/RichLibrary/RichLibrary.csproj
          -c Release
          -r linux-x64
          -o ./publish/sample

      - name: Publish deployment host
        run: >
          dotnet run --file scripts/Deploy-Website.cs --
          -Mode Package
          -DeployHost publish/deploy-host/dotsider-deploy-host

      - uses: actions/upload-artifact@v7
        with:
          name: website-server
          path: publish/website/

      - uses: actions/upload-artifact@v7
        with:
          name: website-sample
          path: publish/sample/

      - uses: actions/upload-artifact@v7
        with:
          name: deploy-host
          path: publish/deploy-host/dotsider-deploy-host

  preflight:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - uses: actions/download-artifact@v8
        with:
          name: deploy-host
          path: deploy-host/

      - name: Run preflight checks
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: >
          dotnet run --file scripts/Deploy-Website.cs --
          -Mode Preflight
          -DeployHost deploy-host/dotsider-deploy-host

  deploy:
    needs: [build, preflight]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dotsider.dev
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'

      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: docs-site/

      - uses: actions/download-artifact@v8
        with:
          name: website-server
          path: website-server/

      - uses: actions/download-artifact@v8
        with:
          name: website-sample
          path: website-sample/

      - uses: actions/download-artifact@v8
        with:
          name: deploy-host
          path: deploy-host/

      - name: Deploy and verify
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: >
          dotnet run --file scripts/Deploy-Website.cs --
          -Mode Deploy
          -DeployHost deploy-host/dotsider-deploy-host
          -Docs docs-site
          -Website website-server
          -Sample website-sample
